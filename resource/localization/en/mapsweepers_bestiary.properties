jcms.bestiary_antlion_cyberguard=CyberGuard
jcms.bestiary_antlion_cyberguard_desc=This is an upgraded Guard engineered by Mafia R&D *specifically* just to piss us off. They're still mostly organic inside. Their outer shell, however, has been largely replaced with intimidating-looking electronics and metal. They also have the ability to apply single-use spherical shields to nearby friendlies that will absorb any damage exactly once, no matter how weak or strong it is. Anyways, these beasts are (somehow) weaker than natural-born guards, but their plated skin further reduces harm from low-damage weapons. It is best to penetrate their armor with heavy, slow-firing weapons and explosives. Though, statistically, you fucking idiot sweepers stick to whatever fancy-looking fast-firing high-DPS bullshit guns you find in the multiverse. Therefore yes, simply shooting a CyberGuard should be enough to take it down anyway.

jcms.bestiary_antlion_drone=Drone
jcms.bestiary_antlion_drone_desc=A common antlion. This specific variant is a mindless drone that can't do basic math or work a desk job (though if we were to evacuate one of them to the mothership, we could easily give 'em a tie and a cubical). Some antlions can speak, some even act completely human - those will usually be idling around, staring off into space... Chances are, they're getting murdered by none other than you, though. Either way, if they happen to be transformed humans - y'know, one of those idiots signing up for the "Let's do crazy science shit and re-enact Kafka's The Metamorphosis" weekly letter - you shouldn't feel bad about killing them. In fact, you'll be doing them a favor, because this is the fastest way they'd respawn back home in a human body. Hopefully. Right, I got sidetracked. Okay, what about antlions? They fly and they swarm you. Just shoot them! High-firerate weapons are favored.

jcms.bestiary_antlion_guard=Guard
jcms.bestiary_antlion_guard_desc=We are not sure if they're the same species as the ordinary Antlion Drones... but what we do know, is that these brutes are plain merciless and unstoppable. They will easily destroy our turrets in a single shove, sending 'em flying away on fire. So that's bad news for the fans of automating their killings. Other than that, they're actually a bit weaker than they look. Try strapping a Timed Explosives on one of them, and it'll be gone in 10 seconds. Make sure you can outrun it, though. Otherwise, the bomb will take you with it.

jcms.bestiary_antlion_burrowerguard=Burrower
jcms.bestiary_antlion_burrowerguard_desc=A special kind of Antlion Guard that, according to what we know, prefers to spend most of its life underground. They watch over grubs and do whatever business insects consider to be important. "So why come out to fight us"? Good question! While we don't know why would anyone possibly hate J Corp, we do believe that the ruckus Sweepers cause during their missions is so obnoxious, that it makes even otherwise emotionless insects somehow feel annoyed. And so, Burrowers come out. They don't like staying outside all that much, and they are considerably weaker than the rest of the crowd... However, they CAN and WILL burrow back underground, and unburrow anywhere - EVEN INDOORS - to destroy all and any sources of noise!

jcms.bestiary_antlion_reaper=Reaper
jcms.bestiary_antlion_reaper_desc=It's a mystery whether these are cybernetic, organic or magical in nature. Mafia hasn't responded to our "what the FUCK is that" e-mails when we first saw them ourselves. Therefore, the information we can give you is limited. As wild as it sounds, "Reapers" are heavy, flightless antlions with floating orb-eyes that shoot sweeping laser beams... Some find them intimidating, others find them hilarious. Dodge the beams, and you'll be fine. We don't think they are capable of melee combat.

jcms.bestiary_antlion_cyberbug=Cyberbug
jcms.bestiary_antlion_cyberbug_desc=A reinforced drone with barrier emitters on its head. Whenever it's on the ground and not attacking, it projects an impenetrable wall of energy in front of itself. This makes the bastard easier to spot, but also protects the Cyberbug and any smaller antlions behind from all harm, allowing more to get close to you. We should mention that turrets will straight up not see them behind the barrier. Orbitals and landmines therefore remain the most effetive options against dealing with Cyberbugs. That, or blasting them in the face from up-close.

jcms.bestiary_antlion_ultracyberguard=ACLP-1
jcms.bestiary_antlion_ultracyberguard_desc=After designing the CyberGuard, Mafia took a step further and made a completely robotic version of a Guard. Though honestly, we still don't know what they call them. JonahSoldier, the CEO of J Corp, glanced at one, said "ultra-cyberguard" in an uninterested tone and went back to his business. We thought calling it an "ultra-cyberguard" wasn't instilling enough fear into the sweepers, so we gave it a cool acronym. It stands for "Antlion Cybernetic Laser Platform". Compared to a normal Guard, it's more agile and more aggressive, though it's pretty easy to kill. It also has a laser cannon for a head (which honestly seems to be all bark and no bite) where it gets the acronym from. Despite custom design and mass-production, Mafia doesn't seem to use ACLPs as a regular combat unit at all, likely due to their inefficiency. Which means, they designed this thing just to fuck with us, nothing else. Again. Seriously?

jcms.bestiary_antlion_waster=Waster Drone
jcms.bestiary_antlion_waster_desc=Basically, this is a smaller & weaker Antlion Drone. No, they're not "young antlions" at all. In fact, these seem to be some sort of scrawny adults that are unable to breed due to their natural small size. This also makes them savagely fierce. They're easy to kill, but they're going to do everything just to getcha. Wasters are so full of hate that they probably would attack bigger antlions, too... But that doesn't seem to happen, though. Could they experience fear?

jcms.bestiary_antlion_worker=Worker
jcms.bestiary_antlion_worker_desc=Evolution has endowed these bugs with an acid spit. Normally, when they aren't bent on killing you, they use it to dig tunnels. And, well, it needs no saying that it melts through metal armor of our tanks & turrets just as easily as it dissolves rocks. Workers are going to try and stay behind the lines to get your defenses out of order. Moreover, killing them makes them burst and coat everything nearby in acid, so watch out for that.

jcms.bestiary_combine_cybergunship=Strafer Gunship
jcms.bestiary_combine_cybergunship_desc=Gunships that have been hyper-optimized for using their belly-cannon beam. They're overflowing with deadly blue energy. So no fucking around, soldier; you should know how bad the color blue is for business and J Corp as a whole. Their cannons have been upgraded to fire explosive rounds, and they will use their laser much more often than normal gunships. When you hear a siren, KEEP RUNNING! Strafer gunships don't just do a single run, they will keep going after you, so evading it once won't work.

jcms.bestiary_combine_elite=Elite Soldier
jcms.bestiary_combine_elite_desc=An advanced Overwatch soldier, further enhanced by J Corp after we invaded and took full control of the entirety of Universal Union's overworld and subsidiary universes as a result of the "15-minute scuffle". We fitted these guys with a magnetic shield not unlike the one built into sweeper suits. The reason we favored these soldiers is because they have a cool red eye, and we love all things red. Anyway, point is, J Corp generates profit from your engagements with the Combine. We order the Combine to fight you, and we pay you to fight the Combine, which is one of our greatest and most lucrative business strategies. Elite Soldiers carry AR2s and can shoot dark energy balls that'll reposition your turrets in unexpected ways. We've also heard rumors about an SMG-wielding Elite on the loose, but rest assured, it's only rumors. Probably.

jcms.bestiary_combine_gunship=Gunship
jcms.bestiary_combine_gunship_desc=Flying combat synths that look like repurposed space dolphins. They are quite aggressive and don't respond well to Turrets (which they consider to be crude mockery of their own image). That's why - you guessed it - Gunships will quickly leave you defenseless, even if their mouth-machinegun isn't directly dangerous on it's own. If you're lucky enough to be sweeping a map that features enterable buildings or underground sections, you can easily hide from a Gunship indoors. Otherwise, use Orbital Beams and Anti-Air Missiles to take them down before they can charge their devastating belly cannon. Right right right, their belly cannon... Gunships are capable of firing a powerful blue beam directly under themselves. Standing in it for longer than a second is a certain death. So when you see things get more blue than they usually are, you better take a few steps to the side.

jcms.bestiary_combine_hunter=Hunter
jcms.bestiary_combine_hunter_desc=Also known as "ministriders", Hunters are sadistic little bastards designed to catch your attention. They have a built-in explosive flechette cannon, and can charge at you & knock you back with a body slam. However, despite their imposing appearance and vicious nature, they're rather easy to kill. Hunters are especially weak to explosives and blunt things bonking their heads, meaning Engineers wielding a Gravity Gun can kill a Hunter without firing a bullet: just fling a turret at it! (though, admittedly, it's faster just to shoot the Hunter to death)

jcms.bestiary_combine_metrocop=Metrocop
jcms.bestiary_combine_metrocop_desc=Cops who have been plucked from their city patrol duties just to try and kick your ass. Metrocops carry a manhack with them. Manhacks themselves are nothing dangerous, but they are two other things: a wasted bullet, and a reset shield regeneration. Most metrocops you see aren't very used to real combat. Their usual job is patrolling controlled territories of whichever faction pays the most (usually J Corp), standing next to explosive barrels and dropping environmental storytelling one-liners every once in a while. It's a dream job, right? So you can imagine how frustrated they are to suddenly get pulled into a portal and be instructed with: "Alright, deal some damage to this red-suit-wearing bunny-hopping motherfucker before you go down". Metrocops are pretty insomniac, too, so they just kinda shoot in your general direction and hope the manhacks do the rest. After you kill them, they respawn whereever they used to be, sigh, take their mask off, smoke, and continue their shift.

jcms.bestiary_combine_scanner=Scanner
jcms.bestiary_combine_scanner_desc=Flying little drones that relay information to their assigned squads. Once you're spotted by one, you can be sure that an Overwatch squad is coming your way. They are otherwise harmless, though they do distract turrets and will kamikaze into you upon being shot down. Scanners are annoying, if anything. Luckily, at least they don't seem to blind you with a bright flash.

jcms.bestiary_combine_sniper=Sniper
jcms.bestiary_combine_sniper_desc=Far-reaching, annoying prick with a perfectly accurate plasma sniper rifle. The bullets are conveniently slow enough for you to dodge, though. Move away as soon as you hear a gunshot. When their combine overworld teacher (or whoever the hell) asked them who they want to be when they grow up, they responded with "Eh, y'know, a total fucking dipshit". Snipers will be the reason you'll see your turrets gone, one-by-one. They will be the reason you can't just stand still and hack a terminal for a moment in peace. There is little honor to what they do.

jcms.bestiary_combine_soldier=Soldier
jcms.bestiary_combine_soldier_desc=The Combine has converted many volunteers into cybernetic soldiers, something something "overwatch transhuman arm" or whatever. Supposedly, these are the ultimate combatants: obedient, fearless, yada yada. Truth is, they're fodder, but deadly in numbers. They're capable of using various tactics (mostly flanking) to direct some sure damage your way. Combine Soldiers are armed with SMGs, AR2s and Shotguns, and carry a grenade which can be thrown back where it came from. Those with SMGs will attempt to flank you, those with AR2s will mostly stay put and shoot, and those with Shotguns will charge at you.

jcms.bestiary_combine_suppressor=Suppressor
jcms.bestiary_combine_suppressor_desc=Combine Heavies wielding a powerful machinegun. A suppressor's primary role is in their name, they're tanky and dangerous, but slow. You'll almost never see them running and gunning at the same time, which is why they're an easy target to pick off. Nonetheless, when left unattended, one of these soldiers will personally drag you to hell with a volley of bullets. Or your turrets. Did I mention how quickly they shred your turrets? Well, you'll see.

jcms.bestiary_rebel_alyx=Alyx Vance
jcms.bestiary_rebel_alyx_desc=This elusive woman may seem like a competent hacker, able to simply stare at our machines and take control of them, but the reality is much more grim. As a higher tier gambler, she has gambled so much that her veins simply flow with gamblium instead of blood. Her sheer touch is enough to infuse our turrets with enough purple to turn them into gamblers, too. Fortunately, your stunsticks are infused with J, which can cure gambling, so all you need to do is hit them with it and the "hacked" object will remember their J Corp mandated lessons on market shares, business suits, and red. She used to turn our sweepers into gamblers, too, but it seems she hasn't been gambling enough recently to successfully pull it off.

jcms.bestiary_rebel_dog=D0G
jcms.bestiary_rebel_dog_desc=A robotic gorilla made out of scrap held together by a couple of bolts and prayers. Legend has it that the original prototype used to belong to Alyx Vance and participated in the First Uprising against the Combine. The RGG began to mass-produce D0Gs despite their flawed design (or, rather, a lack of one), hoping to harness the plot armor that makeshift devices powered by friendship seem to have against the Militaristic Bad Guys. It worked. Not as deadly as the original, but the D0G will run and roll through a hail of bullets, pound the ground and send shit such as yourself and your turrets flying. Needless to say, it is a rather disorienting experience. Luckily, you can avoid it by jumping just before the shockwave can hit you. D0G also has a gravity gun in its hand, and it can and will grab hacked RGG turrets and fling them at you.

jcms.bestiary_rebel_fighter=Fighter
jcms.bestiary_rebel_fighter_desc=Run-of-the-mill gambler armed with an AK. Their gear is a lot cheaper and more worn than that of our troops, because any profit they make, they gamble it away. This would be an advantage for you, but despite their poverty, they are surprisingly hard to kill. Maybe it's their sheer stupidity that keeps them alive. Some of them also carry extra supplies on their backs that you'll want to loot. All fighters also come equipped with medkits and health vials that they hope to share with their buddies. And - we REALLY don't know why, but - they will also share some with you if you approach them. It gets many Sweepers confused, but it's a consistent and totally inexplicable behaviour that you should safely abuse as risky healing. And after you get what you want, show these environmentalists neither gratitude nor mercy. Just look out for nearby Breachers - they won't give you any favours.

jcms.bestiary_rebel_breacher=Breacher
jcms.bestiary_rebel_breacher_desc='Insane motherfucker with a shotgun' is a rather exhaustive description of this welding-mask-wearing rebel. So much so that, admittedly, we have little of our own to add. Their behaviour is to simply run at the enemy and never stop shooting. We captured Breachers to interrogate and finally diagnose them, but what we found is that these "people" have less self-preservation than a hamster. I swear, the RGG probably made them compete for who can get killed the fastest. All of the captives attempted to break free, but not to escape - rather, given the opportunity, they went to carry out whatever suicidal idea that gets as many people around them killed as possible. One particular Breacher was left alone in an interrogation room for 10 minutes, so they proceeded to tip their chair over, crawl to the nearest gas pipe and chew on it until it fucking blew up together with the nearby cells. Fascinating thirst for blood. Unfortunately for them, they're purple.

jcms.bestiary_rebel_helicopter=RGG Helicopter
jcms.bestiary_rebel_helicopter_desc=The RGG has tried to taunt us, sending us letters about how their "genius engineers" have created "brilliant aerial killing machines". Let me tell you a secret. Our science business department examined one of these things, and get this! They are literally slot machines glued together into a faint helicopter form. Otherwise, they just have a few guns attached, and a small space for cargo from where it drops (our!) hacked turrets. The pilot doesn't even have a helm, just a lever with which they gamble. We aren't sure how it actually manages to fly, let alone find its way to enemies and shoot them. Our leading theory is that the pilot actually gambles the direction in which to fly and shoot, and gets lucky enough to seem like the helicopter's actually following and targeting you. Either way, unlike our advanced gunships, these things are held together by purple glue bought from a supermarket. Shoot them to your heart's content - they'll drop, soon enough.

jcms.bestiary_rebel_megacopter=Enforcer Copter
jcms.bestiary_rebel_megacopter_desc=Often times whenever J Corp needs something to perform better, we paint it more red, or we give it a business tie and suit, or we change its name to have more J in it, or give it its own little office cubicle. The RGG has picked up on our strategy, and through what we can only assume was the worst shower thought of his life, the RGG ringleader Traeesen started making even his helicopters gamble, and it has made them a lot more powerful. Apparently, their casinos have special slot machines designed for helicopter use. Helicopters are seemingly really prone to gambling (maybe because they are already slot machines?), and they climbed up the gambling ranks very easily. If you think that RGG symbol on this thing is just a fresh coat of paint, you'd be wrong - they are tattoos, which all RGG Enforcers seem to boast, perhaps as a sign of loyalty. In any case, these things have so much raw gambling power in them that they turn purple from it, and that seems to protect them somehow. But it's nothing a good old "shoot that thing until it explodes" can't solve.

jcms.bestiary_rebel_odessa=Odessa Cubbage
jcms.bestiary_rebel_odessa_desc=A renowned colonel from a bygone era, Odessa Cubbage bravely led Resistance forces against the Combine during the First Uprising (that was before the Combine was assimilated by J Corp anyway... hence why the Rebels won that war. Cough-cough. Jod, it's such a pity our corporation didn't exist back then. We'd kick everyone back into their cubicals & tax everyone on both sides). Hunters, gunships, striders... You name it. He fucking ripped their brains out with his bare hands and ate them on the spot! Quite a hard-ass he was. When his fists ran out of ammo or weren't available, he'd use his RPG. Apparently, he was just that good, so they sampled his DNA later. So he got flash-cloned - his dirty clothes, RPG and all included - to build an army. Unfortunately his brain kinda degraded, so his clones aren't so tough anymore. That, or the stories he's been telling are full of shit (people took his word for it back in the simpler days). Either way, he's got an RPG, and he was instructed to use it against us. If your aim is any good, you should be able to shoot his rockets down before they reach you.

jcms.bestiary_rebel_vanguard=Vanguard
jcms.bestiary_rebel_vanguard_desc=Survivors of Spontaneous Mass Human Combusition Event of 2833 and other minor fire safety related accidents. Vanguards are heavily armoured and receive much less damage from bullets than other rebels. Conveniently, they also carry a glowing backpack that powers their makeshift Incendiary Grenade Launchers - it's a weak spot that can explode and set nearby enemies in a huge radius on fire. If you're careful enough, you can kill a Vanguard without destroying its backpack, so that you can pick it up and throw at others... Vanguards will shoot Flame Grenades at you. And Flame Grenades, despite dealing little damage on their own, set an area on fire, which is a sure end to a cozy turret nest. Luckily, you can pick them up and throw right back. If only Vanguards weren't immune to fire... They've been through worse, after all.

jcms.bestiary_rebel_vortigaunt=Vortigaunt
jcms.bestiary_rebel_vortigaunt_desc=Humble ascetic alien beings that united with RGG in their vile philosophy of eternal gambling. What secured their place in the gang is the fact that Vorts can peer into the future and predict outcomes. And when the outcome isn't favourable, they may act as RGG's 'handicappers' of sorts, taking matters into their own hands and eliminating opposition with a focused beam of energy. From their hands. Get it? Their role in combat isn't purely offensive, though - they also can apply rapidly-decaying yet incredibly durable protective auras to their allies. If you see a Vort sparkling with green electricity, then it's about to buff the squad. The neat part is, your sweeper shield can also benefit from this surge of energy, so you can recharge (and even overcharge) it if you get close to a Vortigaunt in time.

jcms.bestiary_zombie_boomer=Boomer
jcms.bestiary_zombie_boomer_desc=Boomers are zombies that have been infected with Blastcrabs. Almost 80% of their body mass is just rotten blood and young Blastcrabs. They barely have any muscles left in them to raise a hand at you, but they will burst from overstimulation when approached, which will release around 7 Blastcrabs into the open. Make sure to shoot boomers, even after they started bursting - this'll kill the blastcrabs inside and leave you with fewer of them to deal with. Killing a boomer via particularly deadly means, such as using explosives or superheated plasma, will ensure no crabs are left for you to worry about. You could also try to use a stunstick on them - that'll knock the Boomer back and prime the blastcrabs inside for a strong explosion! Use it to your advantage.

jcms.bestiary_zombie_charple=Charple
jcms.bestiary_zombie_charple_desc=Charred, possessed corpses - Charples are a byproduct of a Zombie Spawner feeding on buried bodies and spewing out the remains to the surface. While they're weak and can be killed in a single shot, Charples are relentless and deal a ton of damage. One of them is capable of almost fully destroying a newly-placed turret with a single leap. Be sure to deal with them as soon as possible, but better yet, deal with their source!

jcms.bestiary_zombie_combine=Zombine
jcms.bestiary_zombie_combine_desc=Explosive runners, living bombs, walking detonators. Call them whatever you want. These suicidal bastards are sure to ditch their friends, life, job and savings just to make sure you go down with a blast. If you see one grabbing a grenade from their pocket, do the same. Just without the job part. Also, it's worth mentioning that if you ever stumble upon one who's able to control their inner instincts it's still best to stay away. In close quarter combat they are rather tanky and almost as strong as poison zombies. So watch out for the red, blinking light if you ever see one. Especially in the dark. Some sweepers tend to follow it blindly as if it was an angler fish... do any of you actually fall for that?

jcms.bestiary_zombie_explodingcrab=Blastcrab
jcms.bestiary_zombie_explodingcrab_desc=Headcrabs that likely mutated due to exposure to radiation or have been bio-engineered to explode on contact. They radiate green light, making them easy to spot; still, they're the most dangerous breed of a common headcrab that we know. They produce "Boomer" zombies by latching onto victims, but we're not sure how that happens, given that Blastcrabs usually immediately disappear after the first bite... Maybe it requires a certain stage of maturity? Anyways, the energy contained inside of them can be released into nearby zombies if you happen to punch a Blastcrab with a stunstick mid-air. It's not much, but it'll be enough damage to kill off other headcrabs and severely damage zombies. Good luck.

jcms.bestiary_zombie_fast=Fast Zombie
jcms.bestiary_zombie_fast_desc=At first glance, this zombie variant might not seem all that dangerous, lacking skin and all kinds of outer tissue, but don't fret. What they don't achieve with muscle, they achieve with speed... and numbers. Their howls are enough to drop some sweepers to their knees, but when you see that there's a bunch of them on their way to maul you? Well, beg Jod for mercy and be prepared for quite the blood-shed. Oh, forgot to mention that they can crawl walls & leap at you from about 20 meters away like a cheetah. Sadly, these went extinct 127 years ago.

jcms.bestiary_zombie_crawler=Crawler
jcms.bestiary_zombie_crawler_desc=Fast Zombies, but lacking the bottom half. They can't leap anymore, but this doesn't stop them from being faster than the rest of the horde, being able to crawl up walls and being bent on spilling your guts. So the way we see it, this has got to be some kind of a "less zombie per zombie" efficiency plan. A filthy environmentalist must've come up with this idea, thinking about saving the planet, no less. We'll give credit where it's due, though - nothing's better than cutting in half and ending up with a fully functional product. Thanks to their size, crawlers are unhindered by the rest of the horde and will pass right through other zombies. They will also get under our turrets, possibly throwing off their targeting. Don't underestimate them.

jcms.bestiary_zombie_husk=Husk
jcms.bestiary_zombie_husk_desc=Unlucky fellows who either got ambushed by a headcrab, or didn't read the real estate contract too carefully. Slow, dumb, and aggressive in their past life, they now have a mind-controlling parasite attached to their head making the matter worse. We're not sure why they're all bloody and gutted, but we approve of their appearance, since it's red. Deliver these zombies good news that they've been accepted into J Corp by passing the color test. Then blast them in the head with a shotgun to make sure they respawn right in the office - that'll seal the deal. Shoot them anywhere else, though, and that'll prompt the headcrab to latch off.

jcms.bestiary_zombie_minitank=Minitank
jcms.bestiary_zombie_minitank_desc=You know how when you got hired as a sweeper, if you weren't already part of J Corp, you just instantly lost all aggression towards J Corp once you started wearing red clothing? Well, same could be said for this guy - he was a professional boxer and, one day, did a little cosplaying. He's still stuck in that cosplay, because now he's part of the zombies until he takes the cosplay off. That doesn't make him any less strong, though (though he does seem to be walking slower like an actual zombie, and also seems to be acting as stupid as one). He can't throw the headcrab at you (it's a plushie, though that doesn't seem to stop the plushie from attacking you once he dies), but he's damn tanky, and his punch will knock anything way back, especially your turrets. Sadly, he still respawns in the cosplay, so you'll have to deal with him until someone finally decides to just take the poor guy's hat off. We've been dealing with him for years, so that seems unlikely to happen. I think there's something about the physics engine? I don't know.

jcms.bestiary_zombie_poison=Poison Zombie
jcms.bestiary_zombie_poison_desc=Look. It's 2925. You've played Half Life 9 by now. You know what these guys do. In fact they literally scanned one to make the games. They're slow, they're tanky, they throw poison headcrabs at you. Poison will do a lot of damage that your gear will help you recover from, so don't ask yourself why you're regenerating, and please for the love of Jod don't immediately call a first aid the moment you see your health drop. Just wait a little. I know it's hard - we only require a 2 second attention span from our sweepers (and even then I heard of sweepers bribing our interviewers with as little as a red popsicle) - but please. Also, please don't fucking call reception asking why the headcrabs don't give you J on death. Why would we reward you for that? That literally takes a single bullet. Do you think J grows in trees? Well, I mean, it can, but you get the point.

jcms.bestiary_zombie_spawner=Spawner
jcms.bestiary_zombie_spawner_desc=Demonic growths on the floor that feed on buried corpses. We haven't bothered to study them beyond the basics, but these creatures seem to leech bodies from under the ground, digest whatever's edible, then spew out possessed, charred remains we dubbed "Charples". They lump multiple such charples together into a ball, then shoot it out like a mortar towards any disturbance they feel in the area (you). Spawners don't move and can't defend themselves in any other way. You can tell that one of them is present if you hear periodic, distant screams... And, of course, you'll likely notice the flaming balls of packed Charples coming your way. Spawners are weak to explosives, so carpet-bombing them or using a C4 is a sure way to get rid of one.

jcms.bestiary_zombie_spewer=Fog Spewer
jcms.bestiary_zombie_spewer_desc=In the earlier days of sweeping we used to encounter "Polyps" [more in the 'extinct enemies' section], ground-based barnacles that produced thick clouds of red toxic gas in their vicinity. However, most Sweepers preferred not to deal with them and only sent... 'delinquent' squadmates for this duty. This, combined with the lack of proper nuclear bombardment of urban areas infested with Polyps, resulted in them evolving into these half-demonic, half-alien beasts. They produce and spread way more gas than Polyps used to - a single Spewer is enough to fill an entire map in seconds. However, because they cover such a large area, the concentration of toxins isn't what it used to be and has become diluted. Therefore this map-wide fog that Spewers produce is, well, safe to breathe in. However, it is not at all harmless. The fog severely limits visibility for our troops, and because it's quite warm, it also limits and throws off the thermal targeting on our turrets. In other words, the fog will allow zombies to get closer to your defenses. So don't underestimate a Spewer. Explosives are especially effective at putting them down.

jcms.bestiary_zombie_creep=Flesh Creep
jcms.bestiary_zombie_creep_desc=We aren't 100% sure what this is yet, but our scientists have theorised it may be what happens when you don't clean your microwave for an extended period of time. Regardless of its origin, it has begun appearing in vast quantities during sweeping missions, feeding on the detritus left behind by dead NPCs. While the increase in red is appreciated, creep heavily limits movement, and has rendered our previous doctrine of slowly walking backwards to avoid being hit significantly less effective. The company-recommended approach to dealing with a creep blockage is to annihilate it with orbital bombardment before proceeding, though a few other methods such as tesla-coils have also been found to be effective. Creep spores are generally released in bursts, with colonies expanding to encircle sweepers every 1/21240th of a lunar cycle (or roughly every 2 minutes). Outside of these bursts it is largely inert, though a few stray colonies may still form periodically. Unless intentionally farming them for additional J credits, distant creep colonies can generally be ignored, as colonies will naturally decay when starved of new bodies to feed on. 

jcms.bestiary_zombie_spirit=Spirit
jcms.bestiary_zombie_spirit_desc=These apparitions are manifestations of rage and anguish, combined with a vast amount of J-energy. While they can't hurt you on their own, they can transport slower zombies by absorbing them and releasing later in your vicinity. You'll know that a spirit is around once you start seeing zombies materialize out of thin air in front of you. J Corp considered hiring these spirits for transporting personnel, but this was rendered impossible by the spirits' incorporeal nature. To put it more simply, we couldn't hire them because they couldn't hold a pen to sign the contract with.

# Cut enemies

jcms.bestiarycut_rebel_medic=Medic
jcms.bestiarycut_rebel_medic_desc=Nobody from the RGG has health insurance, and whenever they do, they usually gamble it away. Their solution to this otherwise debilitating socio-economic disaster is to take some water, dye it green, put it in a used medkit (usually stolen from us), and then dump it on the wounded. These guys carry those around, applying the “medkits” to the wounded. It works damn well, and our scientists are also looking into this. One thing you should keep in mind is that gamblers aren't very smart, so they may think you're on their side. If you manage to not shoot them on sight (they're purple, I know, but just bear with it for a second), you may even manage to get one of them to heal you.

jcms.bestiarycut_rebel_rgg=RGG Grunt
jcms.bestiarycut_rebel_rgg_desc=If you thought regular RGG rebels are braindead - just wait until you hear this. These guys barely even exist! They scream so much because, once the adrenaline of the battlefield hits their sometimes-there brains, it gets them conscious enough to form their first thoughts. What you care about is that bullets just sort of sometimes don't work on them, which proved to be troublesome for the earliest of sweeper squads. Fortunately, after intense diplomatic discussions with RGG Ringleader Traeesen, he has made their behaviour deterministic - and now the first few attacks against them will straight up phase through, but the next one will instantly kill them. In other words, they don't have "HP", they have a limited number of hits they can tank, no matter how strong. I know it might be hard for you not to unload 3 whole rockets into whatever you see, but we advise using cheaper ammo against these guys. It is good for business.

jcms.bestiarycut_zombie_polyp=Polyp
jcms.bestiarycut_zombie_polyp_desc=Ground-based barnacle offshots. They exude clouds of red toxins all around them, which will obscure vision and damage you. We'd really love to keep them as pets to pollute our cities with ominous red fog for aesthetics, but Polyps can get annoying as fuck. No matter how many times we screamed at them not to let the gas into the offices, they didn't care. We wish the gas was at least useful for the economy, but no, it isn't. So that's it, this is war. Kill them all. Wander into the fog and eviscerate them. Or call a carpet-bombing over the red clouds for all we care.