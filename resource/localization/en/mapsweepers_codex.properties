jcms.codex_ourmission_name="Our Mission"
jcms.codex_ourmission="# J Corp's Mission\\n\
Although Sweepers are not recognized as J Corp employees within the corporation, members of the initiative are still granted access to J Corp documents. We believe that before an agent can work effectively, they must first understand what they're doing and why. Allow us to provide some inspiration.\\n\
Everything our company produces, from consumer items to military vehicles, is made with the express purpose of bringing as much suffering into the world as possible. Most, if not all of our ventures, make us money exactly so that we can grow at an accelerating rate, to distributie violence faster, at a larger scale and with a bigger reach.\\n\
All of this hatred brings the corporation more J. Ultimately, we strive to seize control of all the J in the world." # really no idea what to write here that doesn't sound conspicuously self-aware and painfully bland

