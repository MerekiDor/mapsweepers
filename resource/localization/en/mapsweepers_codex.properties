jcms.codexlogs_shields_name="Info: Shields"
jcms.codexlogs_shields="Rechargeable magnetic shields are known to be commonly employed by J Corp forces. The "Sweepers" of their newest branch are no exception.\\n\
Examining stolen equipment hasn't revealed anything surprising, but knowledge of some specifications may be useful.\\n\
A sweeper's armour has built-in shield emitters powered by volatile J Energy cells. The shape of the battery slots match those we found in other J Corp's smaller equipment, such as turrets; we dubbed it "Compact Sweeper Format" for now.\\n\
Unlike J Corp's regular army shields, Sweeper shields lack the ability to constantly regenerate under gunfire. In exchange, they are considerably stronger and are able to absorb fatal damage. Sweepers spend a lot of time in desolate off-world locations where the conditions are uncertain, so this adaptation makes sense - especially given that some of the sweepers work alone.\\n\
These playthings bring a lot of issues to Mafia's operations. We will continue stalking stray sweepers to perfect the "Sweeper Hunter" program."

jcms.codexlogs_bubblemantle_name="Info: Bubble Mantle"
jcms.codexlogs_bubblemantle="Our shielding technology has time after time proven to be exceptionally effective in duels. The Bubble Mantle is capable of absorbing any amount of damage a limited number of times - something that has saved countless of Mafia's officers and high-ranking officials from assassinations and bombardment.\\n\
The Bubble Mantle can be applied to any entity remotely - a huge advantage over rival technology which requires a constant supply of massive amounts of energy. Moreover, the Mantle lasts indefinitely and does not require anything to keep it up once it's been applied.\\n\
While J Corp is certainly better fitted for withstanding a rain of bullets, a properly trained squad of our soldiers can have a tactical advantage and overwhelm the enemy with hit-and-run tactics while soldiers in cover have their mantle re-applied.\\n\
We noticed that J Corp's "sweepers" are easily overwhelmed by the antlions we deploy in their area of operation. The "Bastion Program" will help enhance the bioweapon's might by creating a cybernetic Antlion Guard that is capable of applying the Mantle to its lesser brethren.\\n\
This shall be a reminder that no collaborator of J Corp is safe from Mafia's gaze."

jcms.codexlogs_tombstone_name="My grave"
jcms.codexlogs_tombstone="Earlier today, I visited my own grave. 1998-2056. Apparently, I died on 12th of April. But 2 weeks ago I was granted a second life. Strange, knowing this. That day was my childhood friend's birthday. A day I celebrated many times.\\n\
She died young, back in 2024. I can't believe that she must've respawned somewhere, too. I wonder if we'll reunite. I contacted my parents shortly after coming back, but finding lost friends is really tricky with how flooded the Internet and the streets are.\\n\
I can't believe death was never permanent. "Memento mori" sounds so silly now."

jcms.codexlogs_norelease_name="No release"
jcms.codexlogs_norelease="I have died 5 times and I'm still alive.\\n\
Like almost everyone else's, my first death was in the "old world". When I respawned, I was confused to say the very least. At that point, my first life felt like a dream. Do you know the feeling of an incredibly realistic dream slowly fading away from your memory as soon as you wake up? I'd say this is what respawning felt like.\\n\Of course, I remember all the key memories and details from my first life, but I don't really feel like it was me who has experienced them anymore. It's hard to describe, but back then, I felt present. Now it's as if none of it was ever real. Yeah, just like waking up from a vivid dream.\\n\I needed to experience life again. I didn't know what to do with the fact that death was just a farce all along, but I felt the urge and the power to be alive again. To rediscover everything for real this time.\\n\Then I died again. I was shot, but I respawned without a wound. Later, I had leukemia, I succumbed to it, but then I respawned healthy. I lived to old age, then I respawned 25 again.\\n\Each and every time, despite knowing that death won't be the end of me, I felt as scared of dying as in my first life. But when I respawned, all that fear, all the tiredness and boredom of old life went away. The new life also granted me new passion and new fear, like a clean slate with some old memories carried over.\\n\Afterlife is real, isn't it? But how long will this go on for? Will I see this "heaven" grow into a "hell"?"