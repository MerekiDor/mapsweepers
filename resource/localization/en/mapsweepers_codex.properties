jcms.codexlogs_fantlions_name="Fucking antlions"
jcms.codexlogs_fantlions="2925/08/15\\n\
Man I was so excited signing up for this new sweeper gig. I was sent to 4 missions so far, and THREE (!!!) times out of four, guess what? That's right. I was put against Antlions.\\n\
My first mission ever, which I thought was going to be a special day of my life, went something like this: I got out of the drop pod in the middle of some un-Geneva-ed 6th world shithole, barely had time to inspect my assault rifle to make sure I had all of my attachments and stickers on, all giddy. Then, the motherfucker over intercom tells me 'theres more of them' and I'm like WHOM, WHAT DO YOU MEAN MORE? Before I could even ask, suddenly I'm being dragged underground through sand and rocks and spend probably what feels like half a day being eaten alive by grubs.\\n\
I asked my commanding officer TWICE after this incident, to stop fucking sending me against these monsters. I pleaded arachnophobia/ammophobia and all I got in response was 'Talk to Human Resources'. Then I go to HR and I get 'Talk to Biosupport'. I go there and I get 'Talk to your CO'. On the way to CO I get emergency-deployed to what they call 'hell' and get assfucked because nobody told me I had access to turrets.\\n\
I don't know how anyone manages to get through any of this alive because not even turrets help me (they just immediately get surrounded and destroyed by acid). I was trained to fight against the Combine in stealth settings where every single metrocop is conveniently facing away from the door I'm coming from, and not... this."

jcms.codexlogs_firstdayonthejob_name="FIRST DAY ON THE JOB!"
jcms.codexlogs_firstdayonthejob="-# JUST A MONTH AWAY [2925/06/11]\\n\
MY WHOLE LIFE I WANTED TO GET PAID FOR DOING WHAT I LOVE AND NOW IT SOUNDS LIKE I CAN EARN A BIG BUCK SHOOTING PEOPLE IN THE FACE. NOW THAT'S A BACK-TO-THE-ROOTS TRADITIONAL JOB I VERY MUCH PREFER OVER 'DIMENSIONAL FABRIC WEAVER' AND 'NEW COLOR IMAGINER' POSITIONS.\\n\
-# YYYYEAAAAAHHHHH [2925/07/11]\\n\
I GOT 135 COMBINE KILLS! KILLING ARMED PEOPLE IS SO MUCH MORE EXCITING\\n\
-# GMAN SIGHTING [2925/07/16]\\n\
HOLY SHIT"

jcms.codexlogs_shackincident_name="Incident Report #F442BC2"
jcms.codexlogs_shackincident="# 42nd of December, 2924\\n\
3 J Corp Squads have been initially sent to the RGG base of operations, also known colloquially to the J Corp Science Team as 'the moldy shack', with the objective of killing everyone within the facility.\\n\
Upon arrival to the site, the 1st J Corp Batallion successfully breached the entry defenses consisting of approximately one unlocked door with only 54 casualties in the process.\\n\
The J Corp Personnel who had successfully entered the compound started to immediately follow their directive to 'kill everyone' by opening indiscriminate fire at the objects within the RGG stronghold.\\n\
Two soldiers saw a chess board in the corner of the building, and started playing a match, resulting in their casualties.\\n\
Additional J Corp forces were requested to the battlefield to replenish the losses. The amount of combatants was at a constant equilibrium, both shrunk by the gunfire and grown as each squad calling an additional squad upon entering and witnessing previous casualties. It is estimated that there were exactly 10 deaths per second taking place inside the facility.\\n\
One particular challenge that the taskforce faced was the couch, who was described as 'too good at parrying attacks' and was classified as nigh impenetrable. The taskforce did successfully manage to neutralise 4 chairs, 1 table, half of a TV, and bring down at least 2 walls (which have however killed several J Corp Units upon falling).\\n\
Many J Corp soldiers began to grieve the fallen, and started burying their comrades (dead or alive).\\n\
After exactly 10 minutes, 87 seconds, and 3 additional seconds, 99.9% of the J Corpers have been neutralised.\\n\
5 minutes later, RGG command entered the shack, with groceries in their hands, unharmed by the previous events.\\n\
This mission has been a total success and earned the brave fallen soldiers, as well as other completely unrelated J Corp staff, many medals."

jcms.codexlogs_directiveupdated_name="Directive Updated"
jcms.codexlogs_directiveupdated="# Attention J Corp\\n\
-? DATE: March 14th, 2921, 3:24 AM\\n\
-? FROM: J Corp High Command <jchc@mailice.jcorp>\\n\
In order to increase the efficiency of hostage rescue missions, J Corp High Command has decided to make corrections to the Death Squad Protocol.\\n\
We realize that many will find this change upsetting. Please understand that this is among our intentions. All soldiers are required to adapt to the new instructions, no matter how strict.\\n\
-# OLD INSTRUCTIONS\\n\
'Kill everyone on sight'\\n\
-# NEW INSTRUCTIONS\\n\
'Kill everyone on sight except squadmates'\\n\\n\
-? NOTE: This mail has been marked by the sender as urgent. Device notification & volume settings have been bypassed."

jcms.codexlogs_snipingzombies_name="Sniping zombies sucks!"
jcms.codexlogs_snipingzombies="-? This log contains a video of a man in Sweeper Infantry armor recording himself on a mobile phone.\\n\
'Hey. Uh, I'm not sure wh- who or when, really, is going to find this. *If* anyone is gonna find this.'\\n\
-? Lip smack.\\n\
'But.'\\n\
-? The man taps on the phone and, after a slight still-frame delay, it flips from frontal camera to main camera.\\n\
-? The footage reveals that the man is on a rooftop of a building. He demonstrates his pile of 30+ ammo crates.\\n\
'Uhh...'\\n\
-? There's also a cluster of around 10 shield chargers and a tesla coil put right next to each other.\\n\
'I've been... sitting here... with this little bolt-action sniper rifle for... umm...'\\n\
-? The recording flips back to frontal camera. The man is holding the aforementioned weapon up to get it into the frame.\\n\
'HUD says one and a- Yeah. One hour, twenty two minutes.'\\n\
-? The man is sitting against what appears to be a waist-high brick wall - a guard on the edge of the rooftop. He slowly raises the camera to reveal what's beyond that wall.\\n\
-? The footage shows that the district below has been completely flooded with red gas. Hundreds of Fast Zombies are seen jumping from building to building, in and out of the mist. A distant scream is heard, and a flaming lump of Charples flies by.\\n\
'Bit of a sticky situation I've got myself in.'\\n\
-? Shaky exhale.\\n\
'Mothership refuses to evacuate me until I get that last nuke up and running... I- we placed down a locator earlier, and my recon buddy went into the mist to find it. The nuke I mean. It's, uh, half a mile north from here...'\\n\
-? Distant zombie howls. Man turns his head away from the camera for a second.\\n\
'I hope he makes it. I really do. I wish I could, uh, get a dropship or something. I was making maybe 30 or 40 J at a time sniping zombies, but the goddamn gas...'\\n\
-? Sigh.\\n\
'Every time I get a thousand credits, I just waste them on a respawn beacon.'\\n\
-? Recording ends.