jcms.codex_theevent_name="The Event"
jcms.codex_theevent="# The 2286/06/20 event\nAccess to the following information indicates that one has earned enough respect within the Map Sweepers program to be trusted with common knowledge.\nColloquially known as the '(First) Respawn Wave', J Corp documents refer to it as simply 'The Event' to sound as ominous as possible. It is generally considered to be the end of permanent death and the beginning of modern history.\nThe basics are well-known. For several days starting on 20th of June, 2286, the Respawn System brought every single dead human who had ever lived back to life. In random locations around Earth. Cavemen sightings were confirmed. People who died as a result of appearing somewhere stupid simply respawned back again afterwards, which made the whole situation a lot less urgent, but still unpleasant.\nEarth's population reached approximately 130 billion people by the end of the event. We imagine mankind went through its largest socio-economic crisis in recorded history, seeing a shortage of essentials such as food, water, housing and probably patience. This was a great reason to start publicly using previously-experimental dark energy devices - which, we should note, coincidentally were being actively researched shortly before The Event - to compress space, open pocket dimensions and power everything to meet the catastrophically high demands.\nWhatever people believed in either no longer applied or, on the contrary, was reinforced to absurdity. It's hard to imagine these days, but back then a human could die and be silenced forever. Unfortunately, this can no longer solve our problems. Building a society and having such an essential building block taken out of it must have been infuriating."

