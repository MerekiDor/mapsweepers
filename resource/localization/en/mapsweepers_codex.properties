jcms.codexlogs_habitat_name="Project Habitat"
jcms.codexlogs_habitat="-# PROJECT HABITAT // PROGRESS NOTE [2286/07/02]\nPrototype M6 now contains 5.4 sq.km. of habitable interior behind a standard-size metal door. The door must remain open unless technicians inside want to find out if pocket dimensions can be re-connected to.\nWe lost Engineering Team C during yesterday's tests. They came back this morning and refused to enter M6. Congratulations to Team D, they got promoted to Engineering Team C.\nSo far we're able to produce 80,000 rooms a day, but demand for the month is 15 million and other companies are catching up. Management is discussing the possibility of just straight up forming corporate death squads to slow down the competition, but the primary concern is that it'll just make the rival companies work faster out of spite.\nPeople have already started getting picky with their housing: some settle for apartment complexes, others demand a whole [CENSORED] tropical island inside. Thankfully we have enough sand from [REDACTED], just don't tell anyone where it came from, it'll lower the price prolly."

jcms.codexlogs_spacemining_name="Supply Chain Restored"
jcms.codexlogs_spacemining="# 2286/06/28\nHANDLER: Prospector-9, come in.\nP9: Reading you. State your business.\nHANDLER: HQ demands to resume mining operations around Jupiter ASAP. Hiatus is over.\nP9: [...] Heard that. Central, we're understaffed, most of the crew's been laid off.\nHANDLER: We're sending you 30 more prospectors, 150 mining vessels and 20 FTL cargos. ETA 50 hours.\nP9: Come again. 'FTL' as in... Faster than light?\nHANDLER: Correct. Faster than light cargo vessels. We're facing extreme resource demands from Earth, we need everything, immediately. Management says you should focus on Europa as well. We need water, salt, everything.\nP9: Copy that. [...] Central, this isn't a joke, is it? How is FTL possible?\nHANDLER: Dark Energy space compression. It used to be experimental, secret tech until a few days ago. Until... [inhale] dead people started respawning, apparently. Alive and well. So they started using it to make room for everyone. Earth's overflowing. It's a shitshow.\nP9: [...] Central, have you... celebrated last night?\nHANDLER: [sigh] Negative. The ships we're sending are fully staffed, overstaffed even. Lots of willing hands, lots of people want somewhere to stay. They're even willing to go to space for that.\nP9: [...] Okay?\nHANDLER: And... Vessel 6P-15 has got a 'Matthew Robert Campbell'. Identified himself as your brother.\nP9: Matt? Matt? Alive? Wh- What does he look like?\nHANDLER: Some kind of a blade tattoo on his left arm, short hair...\nP9: [gasp] Matt! Central, please, if this is some kind of a sick joke...\nHANDLER: Negative. You will see him yourself. ETA 50 hours. [...] We sent you the details of the mining plan, get to it immediately, mobilize everyone.\nP9: Copy that!"

jcms.codexlogs_fantlions_name="Fucking antlions"
jcms.codexlogs_fantlions="# 2925/08/15\nMan I was so excited signing up for this new sweeper gig. I was sent to 4 missions so far, and THREE (!!!) times out of four, guess what? That's right. I was put against Antlions.\nMy first mission ever, which I thought was going to be a special day of my life, went something like this: I got out of the drop pod in the middle of some un-Geneva-ed 6th world shithole, barely had time to inspect my assault rifle to make sure I had all of my attachments and stickers on, all giddy. Then, the motherfucker over intercom tells me 'theres more of them' and I'm like WHOM, WHAT DO YOU MEAN MORE? Before I could even ask, suddenly I'm being dragged underground through sand and rocks and spend probably what feels like half a day being eaten alive by grubs.\nI asked my commanding officer TWICE after this incident, to stop fucking sending me against these monsters. I pleaded arachnophobia/ammophobia and all I got in response was 'Talk to Human Resources'. Then I go to HR and I get 'Talk to Biosupport'. I go there and I get 'Talk to your CO'. On the way to CO I get emergency-deployed to what they call 'hell' and get assfucked because nobody told me I had access to turrets.\nI don't know how anyone manages to get through any of this alive because not even turrets help me (they just immediately get surrounded and destroyed by acid). I was trained to fight against the Combine in stealth settings where every single metrocop is conveniently facing away from the door I'm coming from, and not... this."

jcms.codexlogs_firstdayonthejob_name="FIRST DAY ON THE JOB!"
jcms.codexlogs_firstdayonthejob="-# JUST A MONTH AWAY [2925/06/11]\nMY WHOLE LIFE I WANTED TO GET PAID FOR DOING WHAT I LOVE AND NOW IT SOUNDS LIKE I CAN EARN A BIG BUCK SHOOTING PEOPLE IN THE FACE. NOW THAT'S A BACK-TO-THE-ROOTS TRADITIONAL JOB I VERY MUCH PREFER OVER 'DIMENSIONAL FABRIC WEAVER' AND 'NEW COLOR IMAGINER' POSITIONS.\n-# YYYYEAAAAAHHHHH [2925/07/11]\nI GOT 135 COMBINE KILLS! KILLING ARMED PEOPLE IS SO MUCH MORE EXCITING\n-# GMAN SIGHTING [2925/07/16]\nHOLY SHIT"

jcms.codexlogs_shackincident_name="Incident Report #F442BC2"
jcms.codexlogs_shackincident="# 42nd of December, 2924\n3 J Corp Squads have been initially sent to the RGG base of operations, also known colloquially to the J Corp Science Team as 'the moldy shack', with the objective of killing everyone within the facility.\nUpon arrival to the site, the 1st J Corp Batallion successfully breached the entry defenses consisting of approximately one unlocked door with only 54 casualties in the process.\nThe J Corp Personnel who had successfully entered the compound started to immediately follow their directive to 'kill everyone' by opening indiscriminate fire at the objects within the RGG stronghold.\nTwo soldiers saw a chess board in the corner of the building, and started playing a match, resulting in their casualties.\nAdditional J Corp forces were requested to the battlefield to replenish the losses. The amount of combatants was at a constant equilibrium, both shrunk by the gunfire and grown as each squad calling an additional squad upon entering and witnessing previous casualties. It is estimated that there were exactly 10 deaths per second taking place inside the facility.\nOne particular challenge that the taskforce faced was the couch, who was described as 'too good at parrying attacks' and was classified as nigh impenetrable. The taskforce did successfully manage to neutralise 4 chairs, 1 table, half of a TV, and bring down at least 2 walls (which have however killed several J Corp Units upon falling).\nMany J Corp soldiers began to grieve the fallen, and started burying their comrades (dead or alive).\nAfter exactly 10 minutes, 87 seconds, and 3 additional seconds, 99.9% of J Corp personnel had been neutralised.\n5 minutes later, RGG command entered the shack, with groceries in their hands, unharmed by the previous events.\nThis mission has been a total success and earned the brave fallen soldiers, as well as other completely unrelated J Corp staff, many medals."

jcms.codexlogs_directiveupdated_name="Directive Updated"
jcms.codexlogs_directiveupdated="# Attention J Corp\n-? DATE: March 14th, 2921, 3:24 AM\n-? FROM: J Corp High Command <jchc@mailice.jcorp>\nIn order to increase the efficiency of hostage rescue missions, J Corp High Command has decided to make corrections to the Death Squad Protocol.\nWe realize that many will find this change upsetting. Please understand that this is among our intentions. All soldiers are required to adapt to the new instructions, no matter how strict.\n-# OLD INSTRUCTIONS\n'Kill everyone on sight'\n-# NEW INSTRUCTIONS\n'Kill everyone on sight except squadmates'\n\n\-? NOTE: This mail has been marked by the sender as urgent. Device notification & volume settings have been bypassed."

jcms.codexlogs_lightbeams_name="Light beams of the Jity"
jcms.codexlogs_lightbeams="Random buildings and landmarks have been observed to feature mysterious, perpetually-active spotlights. They produce a pillar of coloured light visible from space, and are always aimed straight upwards. The light's colour corresponds to that of the faction that controls the surrounding area. Interestingly enough, the colour updates almost immediately if the ownership of the territory changes.\nThe spotlights are especially prevalent in the ancient, core parts of the Jity - mostly those built before 25th century, possibly due to heavy turf wars in the early days and the need to mark one's territory. Many were inspired to construct similar spotlights to represent their faction, although those do not have the ability to recolour themselves automatically.\nWhenever one is broken, something or someone repairs it, no matter what. At no point in Jity's history was it reported that the colour of the spotlight was anything other than red, purple or golden; however, it is possible that J Corp could have invested into erasing such records or witnessess."

jcms.codexlogs_resident_name="Conversation log between two citizens"
jcms.codexlogs_resident="-# [previous messages omitted]\nA: right, I saw the spotlight on your apartment building change to red\nA: somewhere around last week?\n\nB: 3 days ago, yes. J Corp claimed it\n\nA: damn\nA: have you moved? if you need a place to stay, I got you\n\nB: It's actually fine\nB: I thought they were going to relocate nonjcorpers if not kill us right on the spot\nB: Turns out they're chill.\nB: Thanks though\n\n-? г[ B: Turns out they're chill. ]\nA: or they don't know you're RGG yet\n\nB: No I'm pretty sure they do. They checked in on every resident. Searched me\nB: not sure what they were looking for, but none of the rgg merch concerned them\nB: they didn't confiscate my guns either\n\nA: don't you have like\nA: a fucking RPG in there?\n\nB: Yeah they didn't mind\nB: Literally one of them saw my acrylic RGG logo on the desk\nB: and asked "whered you get that?"\nB: I didn't want to get shot so I told him\nB: Then he asks "do they make these with J Corp?"\n\nA: lol\nA: that's it?\n\nB: That's it\nB: Lots of people in the building switched to J Corp though\n\nA: coercion\n\nB: maybe. J Corp provides welfare to all members every morning.\nB: They don't give anything to non-jcorp residents, but they don't touch us either\n\nA: ah yes, the best way to break an RGG member, free shit\nA: many of us converted?\n\nB: Idk but I'm staying loyal to the broke lifestyle. Food always tastes better stolen. Not even Mafia's lavish service comes close\n\nA: hell yeah my man\n-# [rest of the conversation omitted]"

jcms.codexlogs_shields_name="Info: Shields"
jcms.codexlogs_shields="Rechargeable magnetic shields are known to be commonly employed by J Corp forces. The "Sweepers" of their newest branch are no exception.\nExamining stolen equipment hasn't revealed anything surprising, but knowledge of some specifications may be useful.\nA sweeper's armour has built-in shield emitters powered by volatile J Energy cells. The shape of the battery slots match those we found in other J Corp's smaller equipment, such as turrets; we dubbed it "Compact Sweeper Format" for now.\nUnlike J Corp's regular army shields, Sweeper shields lack the ability to constantly regenerate under gunfire. In exchange, they are considerably stronger and are able to absorb fatal damage. Sweepers spend a lot of time in desolate off-world locations where the conditions are uncertain, so this adaptation makes sense - especially given that some sweepers work alone.\nThese playthings bring a lot of issues to Mafia's operations. We will continue stalking stray sweepers to perfect the "Sweeper Hunter" program."

jcms.codexlogs_bubblemantle_name="Info: Bubble Mantle"
jcms.codexlogs_bubblemantle="Our shielding technology has time after time proven to be exceptionally effective in duels. The Bubble Mantle is capable of absorbing any amount of damage a limited number of times - something that has saved countless of Mafia's officers and high-ranking officials from assassinations and bombardment.\nThe Bubble Mantle can be applied to any entity remotely - a huge advantage over rival technology which requires a constant supply of massive amounts of energy. Moreover, the Mantle lasts indefinitely and does not require anything to keep it up once it's been applied.\nWhile J Corp is certainly better fitted for withstanding a rain of bullets, a properly trained squad of our soldiers can have a tactical advantage and overwhelm the enemy with hit-and-run tactics while soldiers in cover have their mantle re-applied.\nWe noticed that J Corp's "sweepers" are easily overwhelmed by the antlions we deploy in their area of operation. The "Bastion Program" will help enhance the bioweapon's might by creating a cybernetic Antlion Guard that is capable of applying the Mantle to its lesser brethren.\nThis shall be a reminder that no collaborator of J Corp is safe from Mafia's gaze."

jcms.codexlogs_tombstone_name="My grave"
jcms.codexlogs_tombstone="Earlier today, I visited my own grave. 1998-2056. Apparently, I died on 12th of April. But 2 weeks ago I was granted a second life. Strange, knowing this. That day was my childhood friend's birthday. A day I celebrated many times.\nShe died young, back in 2024. I can't believe that she must've respawned somewhere, too. I wonder if we'll reunite. I contacted my parents shortly after coming back, but finding lost friends is really tricky with how flooded the Internet and the streets are.\nI can't believe death was never permanent. "Memento mori" sounds so silly now."

jcms.codexlogs_norelease_name="No release"
jcms.codexlogs_norelease="I have died 5 times and I'm still alive.\nLike almost everyone else's, my first death was in the "old world". When I respawned, I was confused to say the very least. At that point, my first life felt like a dream. Do you know the feeling of an incredibly realistic dream slowly fading away from your memory as soon as you wake up? I'd say this is what respawning felt like.\nOf course, I remember all the key memories and details from my first life, but I don't really feel like it was me who has experienced them anymore. It's hard to describe, but back then, I felt present. Now it's as if none of it was ever real. Yeah, just like waking up from a vivid dream.\nI needed to experience life again. I didn't know what to do with the fact that death was just a farce all along, but I felt the urge and the power to be alive again. To rediscover everything for real this time.\nThen I died again. I was shot, but I respawned without a wound. Later, I had leukemia, I succumbed to it, but then I respawned healthy. I lived to old age, then I respawned 25 again.\nEach and every time, despite knowing that death won't be the end of me, I felt as scared of dying as in my first life. But when I respawned, all that fear, all the tiredness and boredom of old life went away. The new life also granted me new passion and new fear, like a clean slate with some old memories carried over.\nThe afterlife is real, isn't it? But how long will this go on for? Will I see this "heaven" grow into a "hell"?"