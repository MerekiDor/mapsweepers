jcms.codex_factions_name="Factions of the World"
jcms.codex_factions1="# The main players\n-? Due to an influx of completely clueless recruits, J Corp (that's us, yes; that includes you now, too) deemed it necessary to provide some insight into the status quo.\nControl over the world is split between three major factions: J Corp, RGG and Mafia. It wasn't always like this, but the earliest mentions of such a deadlock date back centuries, although there's little credible information surrounding early respawn crisis days, let alone before that.\nIn addition to the core membership, various smaller organizations comprise the major factions. For example, J Corp owns many different PMCs, the RGG has hands in street gangs and casinos, and the Mafia similarly pulls the strings of organized crime and many police forces. Small businesses, store chains, factories - dig into the documents and you'll run into mentions of deals with a major faction or two. Or three.\nIn-faction rivalry and wars between their own subsidiares are also commonplace, so don't go around saying it's just J Corp that endorses "self-competition" or some shit, complaining like that sounds utterly pathetic. It's been a while since the Combine was assimilated into our corporation, and nobody has a problem putting their insurrections down every once in a while.\nFactionless people and organizations also exist, but are almost always acquired by the major factions after gaining some prominence or value. Even if they aren't conquered, bought out or otherwise assimilated, the small fry will inevitably ideologically align with one of the factions (or alternatively, clash against the other two), forcing them to pick a benefactor. They may not represent, but they'll know it."
jcms.codex_factions2="-# J Corp\nOur corporation is responsible for producing (and painting) all things red - you'll be seeing that a lot. Among its many other ventures, J Corp is responsible for launching the Sweeper Initiative, so this makes everything you do and stain property of the corporation. Besides giving you documents and a workplace, we'll provide you with guns, machinery, vehicles and other consumer items for the duration of your service.\n-? NOTE: stop asking us how to become a real employee\n-# RGG\nA [REDACTED] Gamblers Gang, a barely organized network of small street gangs, thugs, rebellion movements, cults, daredevils, high-rollers, online schizos, wizard societies... Let's just say they're generally broke and/or insane people. They're hard to describe as a whole, although one thing all members of the RGG have in common is a bizarre lifestyle.\nThe RGG operates in cells of various sizes. A lot of Sweepers believe that the Rebels they run into during missions are all there is to RGG, but the truth is that the Rebels are just one of many members of a highly-diverse network.\nAll members wield the Gambling Energy and use it extensively in daily life and combat. RGG seems to believe that the more esoteric a person is, the more powerful they will be. Unfortunately, this belief was repeatedly observed to align with reality.\nTheir hierarchy is lopsided - the highest-ranking RGG members are unemployed and live in horrible conditions, whereas the low-ranks remain "slaves to the material world". Don't worry if you see a bunch of pimped-out purple sports cars passing by. It's a dangerous motherfucker if they're approaching you on a donkey or riding a tire like a circus ball."
jcms.codex_factions3="-# Mafia\nThey run the police force, public services and urban infrastructure. Mafia is a charitable organization, providing pro bono work and all that crap. You'll see their stupid yellow hat & handshake logo everywhere.\nBeneath the self-righteous facade of honour lies a horrible truth: Mafia wants you to hate us. Everything they do, they do to seem more noble, to earn the trust of the people. They are wiring every person they help against J Corp. They keep taking our facilities, stealing our technology and disrespectfully repurposing it.\nMafia will want you to believe that they invented FTL, cheap housing and teleportation of energy around the planet (something that J Corp has time after time disputed - the idiots gotta put the cables somewhere), yet they treacherously stole most of the dark matter/energy technology from us.\nMafia has invested a lot of resources into cybernetic enhancements and bioengineering. While they "found" cures to horrible diseases and "provided people in need with enhanced and able bodies", the sheer number of bioweapons such as Antlions they produce and cybernetically modify is concerning. Who knows what else they're doing in secret? At least Sweepers don't have to deal with their MWAT forces."

jcms.codex_gambling_name="Gambling Energy"
jcms.codex_gambling="# Gambling\nA mysterious force of nature. Reportedly, humanity collectively harnessed it following the events of 20th of June, 2286.\nOur corporation bans the usage of gambling, unless authorized by superiors or if it is a part of Applied Gambling Technology (AGT).\nThe process of gambling is called 'flipping'. It allows the user to double-or-nothing anything in existence by betting it against the universe. When we say 'anything', we mean it. This extends not only to material objects and people, but also immaterial things, such as thoughts, skills and knowledge. Hell, even vague concepts and laws of physics. The 'flip' is performed whenever a person consciously decides to gamble something. As a result of this action, they either lose the gambled thing or obtain double of it, whatever the hell that means.\nMost commonly, this ability is used to double valuable items and cash. However, our intel on RGG suggests that higher-tier gamblers are able to perform impressive feats, such as: accessing secret knowledge by 'flipping away their ignorance' somehow, boosting the strength of their punches by repeatedly doubling it before the fist connects, or even turning missed shots into perfect hits by 'flipping away the miss'. A lot of their fighters' skills are rapidly boosted right out of the flip-cloning vat to produce supersoldiers in the blink of an eye. However, not many mention what happens when you lose. It is probably the source of those barely-existing purple ghosts running around in pain, seemingly stuck on the border between our world and the realm of possibilities, phasing in and out. We would like to remind all Sweepers that J Corp banned gambling for a reason.\nLarge amounts of gambling energy manifest as a purple glow, often visible on RGG tech. How that works exactly is yet to be established. We also have no information on whether the 'green energy' vorts use and the purple 'gambling energy' are one and the same (or related to each other at all). However, we do know that the 'green energy' is somehow connected to 'fate', therefore it's reasonable to assume that 'gambling' and 'fate' are connected.\nDespite the Gambling power's destructive potential (as you can imagine, we would be one flip away from total obliteration of our entire corporation), it is evidently impossible to tamper with fate on a level that would destroy humanity, Earth, the universe or otherwise other major players of the Narrative. Exact reasons behind this are unknown. Frankly, we do not care. J Corp, RGG and Mafia continue to exist. Maybe we're just in the timeline where this never happens, or maybe someone flipped away the ability to flip away important details a long time ago."

jcms.codex_metals_name="Minerals and Chemistry"
jcms.codex_metals1="# Exotic Materials\nBecause the original periodic table was not fun enough, humanity has accessed exotic chemical elements with atomic numbers extending far beyond natural numbers. Okay, we do not know how educated an average Sweeper is, so let's assume you slept through chemistry classes.\nHear this: got bored of element #8 (Oxygen), element #1 (Hydrogen), element #26 (Iron), etc.? Get ready for element element #1.5, element #-4, element #'God please help me this hurts' (yes, that entire sentence was a number), element #'52+3i' and so on. Endless fun!\nP.S. For those of you who paid attention in chemistry classes: shut up. Shut up. For the love of Jod do not ask how many protons and electrons these have. Isn't it obvious? Element J has J protons and J electrons. Perfectly sensible. And please do not observe these under microscopes. The only scientist of ours who attempted to do that was mysteriously found with a missing head. We WILL fire you and slaughter everyone you know."
jcms.codex_metals2="-# Jaycorpium\nThe most beautiful element with many wonderful properties! Jaycorpium is a red metal with the atomic number J. We use alloys of Jaycorpium to build the vast majority of our tech, and that includes all the devices, turrets and vehicles that you use in combat.\nJaycorpium has a unique ability to form exceptionally strong bonds with itself and other elements. After all, each atom has a bachelor's degree in economics. By forming business connections with other atoms, Jaycorpium alloys become *exceptionally* resistant to all damage and deformation. Thanks to this property, our products are able to maintain their shape without bending even under the constant stress of weight and gunfire. Noticed how thin the bars connecting the wings of the DS-2 VTOL Dropship to the main body are?\nOf course, like any brittle material, Jaycorpium has its limits. Once it sustains enough stress, it explodes. Just straight up blows up. No, we don't mean it 'shatters' like glass under hydraulic press, it literally combusts, fireball and all. This is especially bad during mining, as Jaycorpium oxide is *especially* prone to violent explosions."
jcms.codex_metals3="-# Argegeum\nA purple... something. Pure argegeum resembles a spongy, malleable substance. The RGG often uses argegeum compounds in their tech, just as we use Jaycorpium. Its primary property is very simple: the atoms constantly gamble themselves, doubling or disappearing, at random intervals. Because of this, if you were to watch a timelapse of a block of argegeum all by itself, you could observe how it grows, bends, shrinks and changes shape in unexpected ways.\nThe RGG uses argegeum in construction of their gambling devices. Primarily that would be slot machines, although we've seen combat applications, such as argegeum ammo that multiplies itself in the magazine.\nWe must emphasize, there is no pattern to these atomic flips WHATSOEVER, which makes argegeum a non-deterministic substance. By all means, this is the closest we get to 'true random' in our universe. By extension, this also means that, so long as argegeum and gambling exist, determinism cannot be true. This element is truly reality-defying."
jcms.codex_metals4="-# Mafium\nNot a real element. This is just gold, copper, sulfur, whatever. Mafia's trying to convince the entire world that it's a real element that exists. Listen: it does not. Their leadership literally just smuggled in trucks of yellow rocks.\nFOR ALL THE MAFIA SPIES READING THIS: STOP FUCKING CLAIMING IT'S REAL. WE LITERALLY FUCKING CONFIRMED THAT THE ATOMIC NUMBER OF THE SAMPLE WAS 79. THAT'S JUST GOLD. NOT MAFIUM. JUST BECAUSE IT'S YELLOW DOESN'T MEAN YOU GET TO CALL IT MAFIUM. JAYCORPIUM IS REAL BUT WE DON'T GO AROUND SAYING BLOOD IS RED BECAUSE J, DO WE?\nMafium has like NO interesting properties whatsoever. They claim it allows for 'lossless redirection and short-range teleportation of energy'. Supposedly, they use it to 'compress space', 'create pocket dimensions', 'travel faster than light' and, more interestingly, 'shoot hyper-accurate energy beams with no energy loss'. You know, the ones some Antlions fire. Well, OUR beams DO NOT USE 'MAFIUM'. OUR magnificent orbital beams open billions of tiny portals and teleport streams of 20,000,000 K hot tungsten plasma atom-by-atom. How about that? Huh? You fucking mafia sons of bitches. TL;DR: there's no mafium, and even if there was, it'd be completely and utterly useless."

