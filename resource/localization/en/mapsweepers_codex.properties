jcms.codex_gambling_name="Gambling Energy"
jcms.codex_gambling="# Gambling\\n\
A mysterious force of nature. Reportedly, humanity collectively harnessed it following the events of 20th of June, 2286.\\n\
Our corporation bans the usage of gambling, unless authorized by superiors or if it is a part of Applied Gambling Technology (AGT).\\n\
The process of gambling is called 'flipping'. It allows the user to double-or-nothing anything in existence by betting it against the universe. When we say 'anything', we mean it. This extends not only to material objects and people, but also immaterial things, such as thoughts, skills and knowledge. Hell, even vague concepts and laws of physics. The 'flip' is performed whenever a person consciously decides to gamble something. As a result of this action, they either lose the gambled thing or obtain double of it, whatever the hell that means.\\n\
Most commonly, this ability is used to double valuable items and cash. However, our intel on RGG suggests that higher-tier gamblers are able to perform impressive feats, such as: accessing secret knowledge by 'flipping away their ignorance' somehow, boosting the strength of their punches by repeatedly doubling it before the fist connects, or even turning missed shots into perfect hits by 'flipping away the miss'. A lot of their fighters' skills are rapidly boosted right out of the flip-cloning vat to produce supersoldiers in the blink of an eye. However, not many mention what happens when you lose. It is probably the source of those barely-existing purple ghosts running around in pain, seemingly stuck on the border between our world and the realm of possibilities, phasing in and out. We would like to remind all Sweepers that J Corp banned gambling for a reason.\\n\Large amounts of gambling energy manifest as a purple glow, often visible on RGG tech. How that works exactly is yet to be established. We also have no information on whether the 'green energy' vorts use and the purple 'gambling energy' are one and the same (or related to each other at all). However, we do know that the 'green energy' is somehow connected to 'fate', therefore it's reasonable to assume that 'gambling' and 'fate' are connected.\\n\
Despite the Gambling power's destructive potential (as you can imagine, we would be one flip away from total obliteration of our entire corporation), it is evidently impossible to tamper with fate on a level that would destroy humanity, Earth, the universe or otherwise other major players of the Narrative. Exact reasons behind this are unknown. Frankly, we do not care. J Corp, RGG and Mafia continue to exist. Maybe we're just in the timeline where this never happens, or maybe someone flipped away the ability to flip away important details a long time ago."

jcms.codex_metals_name="Minerals and Chemistry"
jcms.codex_metals1="# Metals\\n\
Because the original periodic table was not fun enough, humanity has accessed exotic chemical elements with atomic numbers extending far beyond natural numbers. Okay, we do not know how educated an average Sweeper is, so let's assume you slept through chemistry classes.\\n\Hear this: got bored of element #8 (Oxygen), element #1 (Hydrogen), element #26 (Iron), etc.? Get ready for element element #1.5, element #-4, element #'God please help me this hurts' (yes, that entire sentence was a number), element #'52+3i' and so on. Endless fun!\\n\P.S. For those of you who paid attention in chemistry classes: shut up. Shut up. For the love of Jod do not ask how many protons and electrons these have. Isn't it obvious? Element J has J protons and J electrons. Perfectly sensible. And please do not observe these under microscopes. The only scientist of ours who attempted to do that was mysteriously found with a missing head. We WILL fire you and slaughter everyone you know."
jcms.codex_metals2="-# Jaycorpium\\n\
The most beautiful element with many wonderful properties! Jaycorpium is a red metal with the atomic number J. We use alloys of Jaycorpium to build the vast majority of our tech, and that includes all the devices, turrets and vehicles that you use in combat.\\n\Jaycorpium has a unique ability to form exceptionally strong bonds with itself and other elements. After all, each atom has a bachelor's degree in economics. By forming business connections with other atoms, Jaycorpium alloys become *exceptionally* resistant to all damage and deformation. Thanks to this property, our production is able to maintain its shape without bending even under constant stress of weight and gunfire. Noticed how thin the bars connecting the wings of the DS-2 VTOL Dropship to the main body are?\\n\Of course, like any brittle material, Jaycorpium has its limits. Once it sustains enough stress, it explodes. Just straight up blows up. No, we don't mean it 'shatters' like glass under hydraulic press, it literally combusts, fireball and all, even in vacuum. This is especially bad during mining, as Jaycorpium oxide is *especially* prone to violent explosions."
jcms.codex_metals3="-# Argegeum\\n\
A purple... something. Pure argegeum resembles a spongy, malleable substance. The RGG often uses argegeum compounds in their tech, just as we use Jaycorpium. Its primary property is very simple: the atoms constantly gamble themselves, doubling or disappearing, at random intervals. Because of this, if you were to watch a timelapse of a block of argegeum all by itself, you could observe how it grows, bends, shrinks and changes shape in unexpected ways.\\n\
The RGG uses argegeum in construction of their gambling devices. Primarily that would be slot machines, although we've seen combat applications, such as argegeum ammo that multiplies itself in the magazine.\\n\
Notably, there is no pattern to these atomic flips WHATSOEVER, which makes argegeum a non-deterministic substance. By all means, this is the closest we get to 'true random' in our universe. By extension, this also means that, so long as argegeum and gambling exist, determinism cannot be true. Fancy words aside, this element is truly reality-defying."
jcms.codex_metals4="-# Mafium\\n\
Not a real element. This is just gold, copper, sulfur, whatever. Mafia's trying to convince the entire world that it's a real element that exists. Listen: it does not. Their leadership literally smuggled trucks of yellow rocks.\\n\
FOR ALL THE MAFIA SPIES READING THIS: STOP FUCKING CLAIMING IT'S REAL. WE LITERALLY FUCKING CONFIRMED THAT THE ATOMIC NUMBER OF THE SAMPLE WAS 79. THAT'S JUST GOLD. NOT MAFIUM. JUST BECAUSE IT'S YELLOW DOESN'T MEAN YOU GET TO CALL IT MAFIUM. JAYCORPIUM IS REAL BUT WE DON'T GO AROUND SAYING BLOOD IS RED BECAUSE J, DO WE?\\n\
Mafium has like NO interesting properties whatsoever. They claim it allows for 'lossless redirection and short-range teleportation of energy'. Supposedly, they use it to 'compress space', 'create pocket dimensions', 'travel faster than light' and, more interestingly, 'shoot hyper-accurate energy beams with no energy loss'. You know, the ones some Antlions fire. Well, OUR beams DO NOT USE 'MAFIUM'. OUR magnificent orbital beams open billions of tiny portals and teleport streams of 20,000,000 K hot tungsten plasma atom-by-atom. How about that? Huh? You fucking mafia sons of bitches. TL;DR: there's no mafium, and even if there was, it'd be completely and utterly useless."

