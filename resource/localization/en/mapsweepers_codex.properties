jcms.codexlogs_fantlions_name="Fucking antlions"
jcms.codexlogs_fantlions="2925/08/15\\n\
Man I was so excited signing up for this new sweeper gig. I was sent to 4 missions so far, and THREE (!!!) times out of four, guess what? That's right. I was put against Antlions.\\n\
My first mission ever, which I thought was going to be a special day of my life, went something like this: I got out of the drop pod in the middle of some un-Geneva-ed 6th world shithole, barely had time to inspect my assault rifle to make sure I had all of my attachments and stickers on, all giddy. Then, the motherfucker over intercom tells me 'theres more of them' and I'm like WHOM, WHAT DO YOU MEAN MORE? Before I could even ask, suddenly I'm being dragged underground through sand and rocks and spend probably what feels like half a day being eaten alive by grubs.\\n\
I asked my commanding officer TWICE after this incident, to stop fucking sending me against these monsters. I pleaded arachnophobia/ammophobia and all I got in response was 'Talk to Human Resources'. Then I go to HR and I get 'Talk to Biosupport'. I go there and I get 'Talk to your CO'. On the way to CO I get emergency-deployed to what they call 'hell' and get assfucked because nobody told me I had access to turrets.\\n\
I don't know how anyone manages to get through any of this alive because not even turrets help me (they just immediately get surrounded and destroyed by acid). I was trained to fight against the Combine in stealth settings where every single metrocop is conveniently facing away from the door I'm coming from, and not... this."

