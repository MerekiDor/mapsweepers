jcms.codex_clerks_name="Clerks and NPCs"
jcms.codex_clerks="# Basic description\nAlthough NPCs are despicable, stupid, despicable, disgusting, despicable and despicable, they've been occupying a lot of niches since their invention in the real world. That is in spite of them being despicable.\nNPCs possess intelligence of varying complexity depending on what they are meant to be doing. The simplest forms are horribly low-quality "cardboard cutouts" that are seen sliding along sidewalks, disappearing as soon as they are acknowledged. Most are smart enough to fulfill a singular purpose effectively, such as being a cinematic cannon fodder fighter or a clerk working the most boring desk job in the world - something along the lines of pushing keyboard buttons in a particular order demanded by the cyber-antichrist of digital superhell. Some, however, are smart enough to be versatile companions and even appear to lead a meaningful life. However, even the most intelligent ones have been confirmed to have no consciousness. But it rarely stops people from getting attached to them.\n-# Clerks\nShouldn't be difficult to see how useful the NPCs sweepers capture by leading into the EVAC are to our corporation. We immediately restrain and forcibly measure them, then tailor a high-quality business suit for them as they are made to listen to J Corp Company Values before assigning them to a cubical. Many beamed-up combine soldiers, zombies, antlion guards and nuclear bombs have been given this treatment. No asset goes to waste. We'd also like to take this moment to dispel the myth that this is "a fate worse than death". Rest assured, by baiting NPCs into the EVAC, you're giving them a chance at a better life and a meaningful work here at J Corp. Besides, each recruited NPC is a generous pay bonus to the whole squad."

jcms.codex_npcs_name="NPC swarms and portals"
jcms.codex_npcs="# The swarms Sweepers exterminate\nNPCs are practically everywhere, and typically, every area of interest already has a number of them present. We deem it amazing, brave and inspiring to slaughter them all.\nIt would be quite a sad, short-lasting ride if it wasn't for NPC portal storms washing over the area - the ones responsible for bringing in even more victims to the warzone. Individual NPC portals themselves show up as white orbs of light, suspended about chest-high above ground. The size and colour of a portal is indicative of the enemy type that is about to come through. A good sweeper should use the warning time to assess the situation and prepare accordingly.\n-# Portal Anchors\nClaw-like research devices used to catch and forcibly keep otherwise transient NPC portals open. One looks like a metal thing around a small black hole being held in place. They're highly unstable, so damaging them will further disturb the storms and provoke a small wave of NPCs in the vicinity.\nThrough them, J Corp studied and reverse-engineered NPC portals. Eventually, we gained enough insight to improve upon the device's design and develop the "Flashpoint" - a way to stabilize and control the portals.\n-# Teleporting in supplies\nOur corporation has also learned to abuse the lingering disturbance in space-time left by swarm storms to opportunistically send in supplies and combat tech to the battlefield. Consequently, this is only effective in NPC-heavy areas, where the continuum is "ruptured" enough by constant portal storms. So it often helps military logistics to provoke hordes of NPCs to establish faster transportation routes... Hopefully you can connect the two and realize why you get deployed near J Corp warzones. For the love of jod, stop asking for support from our regular military. You are the support, not the other way around."

jcms.codex_respawnsystem_name="Respawn System"
jcms.codex_respawnsystem="# Respawn Beacons\nSweeper, what is the main thing that makes you so deadly? No, it not your might or thirst for blood. It is certianly not your intelligence. Your weapons? Yes, but not necessarily.\nIt's your persistence! Your ability to spitefully come back like the plague and harass the enemy to the point it is not worth the trouble of dealing with you anymore! You're a rat, a disease, a nuisance that cannot be put down for good because you'll just respawn back in the fucker's walls - that is your true strength.\nTo this day, no one has ever found a way to reliably control where a person respawns after death. So instead, J Corp Respawn Beacons utilize soul-to-soma trackers that locate where your body ended up AFTER a natural respawn. The device then abuses the disturbance in space-time left by NPC portals to tear a portal straight to your new location and snatch you back into combat.\nUnfortunately, this process takes a colossal amount of J energy, and a single beacon only has enough charge to bring one person back before the power cells burn out. They're pretty expensive. If possible, look for RGG respawn chambers instead. You can hack them to link them to our systems, we'll handle the rest.\n-# NPCs and death\nNPCs are affected by the respawn system, but it is still debated whether all NPCs eventually respawn, or such a privilege is only reserved for the "meaningful" ones that real people know and remember. A lot of these pests look the same, so it's hard to establish for sure.\nOur corporation has attached soul trackers to NPCs before. A person normally respawns with the soul tracker still attached to them, no matter where they ended up post-mortem. But no tracker was ever recovered from an NPC. Even the "important" individuals came back without one. Whether this means they have no soul or a new copy is spawned is unknown.\nIt's worth mentioning that even animals are confirmed to have souls, so have no meaningless ethical reservations about NPCs."

