jcms.codexlogs_habitat_name="Проект "Падик""
jcms.codexlogs_habitat="-# ПРОЕКТ "ПАДИК" // ОТЧЁТ О ХОДЕ РАБОТ [2286/07/02]\\n\
В прототипе M-6 помещается 5,4 кв. км жилого пространства. Оно находится за металлической дверью стандартного размера. Дверь во время калибрации должна оставаться открытой, иначе инженерам внутри придётся провертяь, можно ли повторно соединить карманное измерение с нашим миром.\\n\
Во время вчерашних испытаний мы потеряли инженерную группу C. Сегодня утром они вернулись и отказались заходить в M-6. Поздравляем группу D: её повысили до инженерной группы C.\\n\
Пока что мы производим 80 000 комнат в день, но квота на конец этого месяц составляет 15 миллионов, спрос огромный, а другие компании нас догоняют. Руководство обсуждает возможность просто начать уже формировать корпоративные отряды смерти, чтобы задержать конкуренцию, но главная проблема в том, что назло нам они могут начать работать только быстрее.\\n\
Люди уже начали привередничать с жильём: одни соглашаются на многоквартирные дома, другим подавай целый [ЦЕНЗУРА] тропический остров внутри. К счастью, у нас достаточно песка с [ДАННЫЕ УДАЛЕНЫ]. Только никому не говорите, откуда он, а то цена упадёт наверн."

jcms.codexlogs_spacemining_name="Цепочка поставок восстановлена"
