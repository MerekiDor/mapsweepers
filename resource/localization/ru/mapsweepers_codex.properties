jcms.codexlogs_shields_name="Информация: щиты"
jcms.codexlogs_shields="Известно, что войска J Corp широко применяют перезаряжаемые магнитные щиты. "Свиперы" из их новейшего подразделения не исключение.\\n\
Изучение похищенного оборудования не выявило ничего удивительного, но некоторые характеристики могут оказаться полезными.\\n\
В броню свипера встроены излучатели щита, питаемые нестабильными батареями J-энергии. Форма отсеков для батарей совпадает с найденной нами в другой малой технике J Corp, например, в турелях; пока что мы назвали форм-фактор энергоблоков "компактным свипер-форматом".\\n\
В отличие от щитов регулярной армии J Corp, щиты свиперов не могут постоянно восстанавливаться под огнём. Но взамен они значительно прочнее и способны поглощать смертельный урон. Свиперы проводят много времени в безлюдных местах за пределами Земли с непредсказуемыми условиями, поэтому такая адаптация разумна - особенно учитывая, что некоторые из них работают в одиночку.\\n\
Эти придурки создают немало проблем операциям Мафии. Мы продолжим выслеживать одиночек, чтобы довести до совершенства программу "Охотник на свиперов"."

jcms.codexlogs_bubblemantle_name="Информация: Пузырьковая мантия"
jcms.codexlogs_bubblemantle="Наша технология щитов раз за разом доказывала чудовищную эффективность в дуэлях. Пузырьковая мантия способна ограниченное число раз поглотить любое количество урона - это спасло бессчётное множество офицеров и высокопоставленных лиц Мафии от покушений и бомбардировок.\\n\
Пузырьковую мантию можно дистанционно наложить на любое существо - огромное преимущество перед технологиями конкурентов, которым нужна постоянная подача огромного количества энергии. Кроме того, после наложения Мантия сохраняется бесконечно и не требует ресурсов для поддержания.\\n\
J Corp, безусловно, лучше приспособлена к тому, чтобы выдерживать град пуль, но правильно обученный отряд наших солдат может получить тактическое преимущество и измотать врага налётами, пока истощённым бойцам в укрытии заново накладывают слои мантии.\\n\
Мы заметили, что "свиперов" J Corp легко подавляют муравьиные львы, которых мы развёртываем в районах их операций. "Программа Бастион" усилит биооружие, создав кибернетического Стража муравьиных львов, способного накладывать Мантию на меньших собратьев.\\n\
Пусть это станет напоминанием: ни один пособник J Corp не укроется от взора Мафии."

jcms.codexlogs_tombstone_name="Моя могила"
jcms.codexlogs_tombstone="Сегодня я навестил собственную могилу. 1998–2056. Оказывается, я умер 12 апреля. Но две недели назад мне подарили вторую жизнь. Странно это осознавать. В тот день был день рождения моей подруги детства. День, который я отмечал много раз.\\n\
Она умерла молодой, ещё в 2024 году. Не могу поверить, что она тоже где-то там жива. Интересно, встретимся ли мы снова. Вскоре после возвращения я связался с родителями, но искать вот старых друзей оказалось очень трудно, особенно когда интернет и улицы настолько переполнены.\\n\
Не верится, что смерть никогда не была окончательной. "Memento mori" теперь звучит так глупо."

jcms.codexlogs_norelease_name="Никакого покоя"
jcms.codexlogs_norelease="Я умирал 5 раз и всё ещё жив.\\n\
Как и почти у всех, моя первая смерть случилась в "старом мире". После респавна я был, мягко говоря, растерян. К тому моменту первая жизнь казалась сном. Знаете чувство, когда невероятно реалистичный сон медленно стирается из памяти сразу после пробуждения? Наверное, респавн ощущался именно так.\\n\Конечно, я помню все ключевые события и подробности первой жизни, но больше не чувствую, что их пережил именно я. Это трудно описать, но тогда я чувствовал, что вот он я, присутствую здесь и сейчас. А теперь всё будто никогда и не было настоящим.\\n\Мне нужно было снова прожить жизнь. Я не знал, что делать с осознанием, что смерть всё это время была временной, но я чувствовал желание и силу снова быть живым. Заново открыть всё - на этот раз по-настоящему.\\n\Потом я умер снова. Меня застрелили, но я респавнился без раны. Позже у меня обнаружили лейкемию, я умер от неё, а затем респавнился здоровым. Я дожил до старости, зареспавнился - а мне снова 25.\\n\И каждый раз, хоть я и знал, что смерть не станет моим концом, я боялся умирать так же сильно, как в первую раз. Но после респавна всё это волнения, вся усталость и скука прежней жизни исчезали. Новая жизнь дарила мне новую тягу к жизни и новый страх - словно чистый лист с несколькими перенесёнными воспоминаниями.\\n\Так вот она, жизнь после смерти. Но сколько это будет продолжаться? Станет ли этот "рай" однажды "адом"?"