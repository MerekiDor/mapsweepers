jcms.codex_jcms_name="Программа Свиперов"
jcms.codex_jcms="# Инициатива J.C.M.S.\\n\
Добро пожаловать в программу Свиперов J Corp "Map Sweepeers" - масштабный проект, запущенный в июле 2925 года, частью которого теперь являетесь и вы, уважаемый свипер.\\n\
Цель проекта проста: уложить под землю как можно больше НПС. Зачем? Ради бизнеса.\\n\
Начнём с базовой информации. Хотите вы этого или нет, теперь вы - машина смерти. J Corp предоставит вам неограниченный доступ к огнестрельному и энергетическому оружию, турелям, орбитальным ударам, боевой технике, экспериментальным приборам и всему такому. От вас же ожидается, что вы будете использовать всё это, чтобы выжать максимум из своего убийственного потенциала и своевременно выполнять приказы корпорации.\\n\
Вам выдано всё необходимое для автономной работы без поддержки. Однако никаких правил против командной работы нет. Вы можете объединяться с другими свиперами в формирования любого размера, работать отделениями или даже взводами. Зовите в программу питомцев и родственников. Вашим долгом будет обучить и воспитать из них настоящих бойцов.\\n\
Учитывая репутацию нашей компании, такие поблажки наверняка вас настораживают. Да дело в том, что формально свиперы не считаются сотрудниками J Corp. Мы принимаем любых добровольцев и набираем случайных людей с улицы. Но конечно, им нужно пройти небольшой тест. Они должны:\\n\
 1. Уметь отличать друзей от врагов (необязательно)\\n\
 2. Уметь пользоваться оружием (необязательно)\\n\
 3. Уметь наносить хоть какой-нибудь урон\\n\
Если они соответствуют всем условиям, то могут стать свиперами! А если не соответствуют - всё равно могут.\\n\
За убийство НПС вы будете получать внутрикорпоративные J-кредиты, которые показывают, насколько вы смертоносны и насколько оправданно снабжать вас дополнительной снарягой. Докажете нам свою ценность - получите повышение уровня. А поднимитесь достаточно высоко - мы, возможно, рассмотрим вашу кандидатуру на настоящую должность в корпорации... В остальном ваш уровень совершенно бесполезен."

