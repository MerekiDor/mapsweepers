ДИСПЕТЧЕР: Отправляем ещё 30 старателей, 150 шахтёрских судов и 20 сверхсветовых грузовых судов. Расчётное время прибытия - 50 часов.\\n\
С-9: Повторите. "Сверхсветовых" - это... как, то есть, быстрее света?\\n\
ДИСПЕТЧЕР: Верно. Грузовые суда быстрее света. С Земли поступает чрезвычайный спрос на ресурсы, нам нужно всё и немедленно. Руководство просит также сосредоточиться на спутнике Европа. Нужна вода, соль, всё подряд.\\n\
