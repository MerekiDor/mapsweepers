jcms.codex_clerks_name="Клерки и НПС"
jcms.codex_clerks="# Основное описание\\n\
Хотя НПС омерзительны, тупы, омерзительны, отвратительны, омерзительны и омерзительны, с момента, как их изобрели в реальном мире, они успели занять немало ниш. Им нашли кучу практических применений. И это несмотря на то, что они омерзительны.\\n\
Интеллект НПС различается по степени развития в зависимости от их предназначения. Самые простые виды - низкополигональные картонки, которые скользят по тротуарам и исчезают, стоит кому-то обратить на них внимание. А большинство достаточно умны, чтобы эффективно выполнять какую-то одну задачу: например, служить пушечным мясом или клерком на самой скучной офисной работе в мире - нажимать клавиш в определённой последовательности по приказам кибер-антихриста из цифрового супер-ада. Некоторые НПС, впрочем, достаточно умны, чтобы служить верными спутниками и даже вести осмысленную на первый взгляд жизнь. Однако подтверждено, что даже у самых продвинутых НПС нет сознания. Но людям это редко мешает к ним привязываться.\\n\
-# Клерки\\n\
Нетрудно догадаться, насколько полезны нашей корпорации НПС, которых свиперы заманивают на платформу Эвакуации. Мы немедленно связываем их и насильно делаем им замеры, затем шьём качественный деловой костюм, заставляем прослушать "Ценности компании J Corp" и назначаем работать в офис. Такая судьба постигла множество телепортированных на базу солдат Альянса, зомби, стражей муравьиных львов и ядерных бомб. Никого без работы не оставим. Также мы хотели бы развеять миф, что якобы работа на J Corp - это "судьба хуже смерти". Будьте уверены: заманивая НПС на Эвакуацию, вы даёте им шанс на лучшую жизнь и продуктивную работу на благо корпорации. Кроме того, каждый завербованный вами НПС принесёт всему вашему отряду щедрую премию."

jcms.codex_npcs_name="Волны и порталы НПС"
jcms.codex_npcs="# Волны, истребляемые свиперами\\n\
НПС есть практически везде, и обычно в любой интересующей нас зоне уже присутствует некоторое их количество. Мы считаем их массовое убийство прекрасным, отважным и вдохновляющим поступком. потому вас туда и отправляем.\\n\
И, учитывая смертоносность свиперов, недолго бы музыка играла, если бы местность тут же не накрывали бури порталов НПС, доставляющие на поле боя новых жертв. Порталы НПС выглядят как белые светящиеся сферы, появляющиеся над землёй примерно на уровне груди. Размер и цвет портала указывают, какой тип врага вот-вот из него выйдет. Хороший свипер должен использовать это предупреждение, чтобы оценить обстановку и соответствующе подготовиться.\\n\
-# Прикованные порталы\\n\
Иногда вы будете встречать исследовательские устройства для захвата порталов НПС. Они выглядят, как металлическая клешня, которая удерживает открытой маленькую чёрную дыру. Такие прикованные порталы крайне хрупки и нестабильны, поэтому повреждение устройства возмущает портальные бури и вызывает поблизости волны НПС.\\n\
С их помощью J Corp изучила то, как работают порталы НПС и научилась использовать их в своих целях. Далее мы улучшили конструкцию устройства и создали "Обелиск" - способ стабилизировать порталы и даже управлять ими.\\n\
-# Телепортация припасов\\n\
Мы также научились пользоваться искажением пространства-времени, которое на какое-то время оставляет за собой каждый портал после закрытия. В каком-то смысле портальные бури "разминают" пространство и делают его более хрупким для открытия новых порталов, из-за чего, во-первых, НПС со временем становится больше, а во-вторых мы сами можем легче посылать вам припасы и технику. Но, логично, что такая схема работает только в местах с большим количеством НПС, где континуум достаточно "размят" постоянными портальными бурями. Поэтому военной логистике часто полезно спровоцировать орду НПС, чтобы открыть в этом месте порталы и легче доставлять военные припасы... Теперь понятно, почему J Corp отправляет вас на миссии рядом с зонами боевых действий? Ради Jоспода, перестаньте просить помощи у нашей регулярной армии. Это вы тут поддержка, а не наоборот."

jcms.codex_respawnsystem_name="Система респавна"
jcms.codex_respawnsystem="# Якоря Возрождения\\n\
Свипер, что делает тебя смертоносным? Нет, не сила и не жажда крови. И уж совершенно точно не интеллект. Оружие? Конечно, но не совсем.\\n\
Это твоё УПОРСТВО! Способность, словно чума, назло противнику возвращаться и продолжать мучить его, пока пытаться устранить тебя не станет себе же дороже! Ты - крыса, смертельная болезнь; ты - вредитель, от которого нельзя избавиться навсегда, потому что после смерти ты зареспавнишься у этого ублюдка прямо в стенах! Это и есть твоё истинное преимущество над любым врагом, свипер.\\n\
До сих пор никому не удалось найти способ задавать место, где человек будет респавниться после смерти. Поэтому Якоря Возрождения J Corp используют трекеры "душа-тело", чтобы определить, где оказалось ваше тело УЖЕ ПОСЛЕ естественного респавна. Затем устройство использует искажение пространства-времени, оставшееся от порталов НПС, разрывает новый портал прямо к вам и уносит ваше тело на прежнее место, прямо в бой.\\n\
К сожалению, этот процесс требует колоссального количества J-энергии, и заряда одного якоря хватает лишь на возвращение одного человека, после чего элементы питания выгорают. А стоят они прилично. По возможности ищите камеры возрождения RGG. Вы можете взломать их и подвязать к нашим системам, а дальше мы разберёмся.\\n\
-# НПС и смерть\\n\
Система респавна действует и на НПС, но до сих пор неясно, возвращаются ли со временем все НПС или такая привилегия доступна лишь "значимым" - тем, кого настоящие люди знают и помнят. Эти безмозглые суки все выглядят одинаково, так что точно установить это трудно.\\n\
Наша корпорация уже крепила трекеры душ к НПС. Настоящий-то человек респавнится с трекером всё еще на душе, где бы ни оказался после смерти. Но ни один трекер, установленный на НПС, так и не удалось найти. Даже "важные" особи возвращались без него. Означает ли это, что души у них нет, или каждый раз создаётся новая копия НПС - неизвестно.\\n\
Стоит упомянуть, что наличие душ подтверждено даже у животных, поэтому не мучайте свою совесть этическими вопросами по поводу убийства НПС."

