jcms.codexlogs_shackincident_name="Отчёт об инциденте #F442BC2"
jcms.codexlogs_shackincident="# 42 декабря 2924 года\\n\
На оперативную базу RGG, также известную научному отделу J Corp под названием "плесневелый сарай", были отправлены 3 отряда J Corp с задачей убить всех внутри объекта.\\n\
По прибытии 1-й батальон J Corp успешно прорвал оборону входа, состоявшую приблизительно из одной незапертой двери, потеряв в процессе всего 54 бойца.\\n\
Успешно проникший на территорию личный состав J Corp немедленно приступил к исполнению директивы "убить всех", открыв беспорядочный огонь по предметам внутри укрепления RGG.\\n\
Двое солдат заметили в углу здания шахматную доску и начали партию, что привело к их гибели.\\n\
Для восполнения потерь на поле боя запросили дополнительные силы J Corp. Число участников находилось в постоянном равновесии: оно сокращалось из-за перестрелки и росло, поскольку каждый вошедший отряд, увидев предыдущие потери, вызывал на подмогу ещё один. По экспертным оценкам, внутри объекта происходило ровно 10 смертей в секунду.\\n\
Особую сложность для оперативной группы представлял диван, который, по описаниям, "слишком хорошо парировал атаки" и был признан практически непробиваемым. Тем не менее группа успешно нейтрализовала 4 стула, 1 стол, половину телевизора и обрушила не менее 2 стен (которые, правда, при падении убили несколько бойцов J Corp).\\n\
Многие солдаты J Corp начали оплакивать погибших и хоронить товарищей, в том числе живых.\\n\
Спустя ровно 10 минут, 87 секунд и ещё 3 секунды 99,9% бойцов J Corp были нейтрализованы.\\n\
Через 5 минут командование RGG вошло в сарай с пакетами продуктов, никак не пострадав от предыдущих событий.\\n\
Миссия прошла с полным успехом и принесла отважным павшим солдатам, а также совершенно случайным сотрудникам J Corp, множество медалей."

