jcms.codexlogs_lightbeams_name="Световые столбы Jити"
jcms.codexlogs_lightbeams="На случайных зданиях и достопримечательностях замечены таинственные, постоянно работающие прожекторы. Они создают видимый из космоса столб окрашенного света и всегда направлены строго вверх. Цвет света соответствует фракции, контролирующей окрестности. Что интересно, при смене владельца территории цвет меняется почти мгновенно.\\n\
Особенно много прожекторов в древних центральных районах Jити - преимущественно построенных до XXV века. Возможно, причиной были ожесточённые войны за территорию в ранние годы и необходимость как-то её помечать, как свою. Многие вдохновляются дизайном этих прожекторов и тоже устанавливают их на свои сооружения, правда у таких прожекторов нет способности автоматически перекрашиваться при смене владельца.\\n\
Если такой прожектор ломается, что-то или кто-то спустя короткое время его чинит, несмотря ни на что. За всю историю Jити не было зафиксировано ни одного случая, когда прожектор светил бы не красным, фиолетовым или золотым; впрочем, возможно, J Corp вложилась в уничтожение подобных записей или свидетелей."

