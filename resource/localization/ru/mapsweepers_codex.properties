ДИСПЕТЧЕР: Сжатие пространства тёмной энергией. Ещё несколько дней назад это была неведомая никому экспериментальная секретная технология. Пока... [вдох] мёртвые, скажем, не начали респавниться. Живыми и здоровыми. Вот технологию и стали использовать, чтобы всем хватило на планете места. Земля-то переполнилась. Там полный пиздец.\\n\
С-9: [...] Центр, вы там это... не отмечали вчера?\\n\
ДИСПЕТЧЕР: [вздох] Никак нет. Суда, которые мы отправляем, полностью забиты рабочими - даже сверх нормы. Желающих полно, очень многим негде жить. Ради жилья они готовы даже в космос полететь.\\n\
С-9: [...] Э-э-э... Допустим.\\n\
ДИСПЕТЧЕР: И ещё... На судне 6P-15 летит некий "Мэттью Роберт Кэмпбелл". Представился вашим братом.\\n\
С-9: Мэтт? Мэтт? Жив? Ка... Как он выглядит?\\n\
ДИСПЕТЧЕР: На левой руке татуировка вроде клинка, короткие волосы...\\n\
С-9: [резкий вдох] Мэтт! Центр, пожалуйста, если это какая-то больная шутка...\\n\
ДИСПЕТЧЕР: Никак нет. Сами его увидите. Прибытие через 50 часов. [...] Мы отправили подробности плана добычи. Приступайте немедленно, мобилизуйте всех.\\n\
С-9: Принял!"

jcms.codexlogs_fantlions_name="Ебаные муравьиные львы"
jcms.codexlogs_fantlions="# 2925/08/15\\n\
Бля, я так обрадовался, когда записался на эту новую работу "свипером". Меня отправили уже на 4 задания, и ТРИ БЛЯТЬ (!!!) раза из четырёх знаете против кого? Правильно. Против жуков.\\n\
Моё самое первое задание, которое, как я думал, станет особенным днём в моей жизни, прошло примерно так: я вылез из десантной капсулы посреди какой-то Женевской конвенцией забытой мухосрани шестого мира, весь на радостях едва успел осмотреть автомат и проверить, на месте ли мои обвесы и наклейки. И тут мудак по рации говорит мне: "их идёт еще больше!", а я такой: КОГО "ИХ" НАХУЙ, В СМЫСЛЕ "ЕЩЁ БОЛЬШЕ"? Я даже спросить не успел, как меня потащило под землю через песок и камни, а потом личинки жуков, по ощущениям, полдня жрали меня заживо.\\n\
После этого случая я ДВАЖДЫ просил командира перестать, блять, посылать меня на задания против этих чудовищ. Ссылался на арахнофобию и аммософобию, а в ответ получал только "обратитесь в отдел кадров". Прихожу в кадры - там говорят: "обратитесь в биообеспечение". Прихожу туда - "обратитесь к командиру". По дороге к командиру меня экстренно забрасывают на какую-то миссию под названием "кошмар", и там меня ебут во все щели, потому что никто мне не сказал, что оказывается мне доступны турели.\\n\
Я вообще не понимаю, как кто-то умудряется справляться с боевыми задачами, потому что даже турели мне не помогают (их сразу окружают и уничтожают кислотой). Я всю жизнь готовился к тактикульному бодикам-стелсу против комбайнов, чтобы каждый метрокоп стоял ко мне спиной и его можно было тихо прибить, а не... к вот этому пиздецу..."

