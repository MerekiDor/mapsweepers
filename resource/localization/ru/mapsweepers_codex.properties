jcms.codex_factions_name="Фракции мира"
jcms.codex_factions1="# Главные игроки\\n\
-? Из-за наплыва совершенно бестолковых новобранцев J Corp (да, да, это мы. Теперь и вы) сочла необходимым хотя бы где-то объяснить текущее положение дел.\\n\
Власть над миром поделена между тремя крупными фракциями: J Corp, RGG и Мафией. Так было не всегда, но самые ранние упоминания такого расклада датируются несколькими столетиями назад. Впрочем, достоверных сведений со времен первых дней респавн-кризиса почти нет, не говоря уж о временах до него.\\n\
Помимо основного своего состава, крупные фракции включают в себя множество организаций поменьше. Например, J Corp владеет разными ЧВК, RGG заправляет уличными бандами и казино, а Мафия же дёргает за ниточки организованной преступности и полиции. Малый бизнес, сети магазинов, фабрики - покопайтесь в документах и найдёте доказательства сделок с одной или даже двумя крупными фракциями. Или тремя.\\n\
Внутрифракционная конкуренция и войны между собственными дочерними организациями тоже обычное дело, так что не надо разгонять, будто только J Corp занимается "внутренней конкуренцией" и прочей хуетой. Такие слухи звучат просто жалко. Альянс вот, например, уже давно поглощён нашей корпорацией, и никого и не смущает, что время от времени нам же приходится подавлять его восстания.\\n\
Люди и организации без принадлежности к фракции тоже существуют, но почти всегда после обретения известности или ценности для общества их приобретают крупные игроки. Даже если их не завоюют, не выкупят и никак иначе не поглотят, они всё равно неизбежно начнут идеологически тянуться к одной из фракций (или выступать против двух других, не оставляя иного выбора), и ей придётся выбрирать своего покровителя. Да, в открытую они может и не сознаются в этом, но мы-то всё понимаем."
jcms.codex_factions2="-# J Corp\\n\
Наша корпорация отвечает и за производство всего красного, и, скажем, за "покраску в красный". Видеть этот цвет с нами вы будете часто. Среди множества прочих начинаний J Corp запустила Программу Свиперов, а значит, всё, что вы делаете и чем пачкаете стены является собственностью корпорации. Помимо документов и рабочего места мы предоставим вам оружие, оборудование, транспорт и прочие потребительские товары на весь срок службы.\\n\
-? ПРИМ.: заебали спрашивать, как стать настоящим сотрудником\\n\
-# RGG\\n\
[РАСШИФРОВКА НАЗВАНИЯ УДАЛЕНА] - разрозненная сеть мелких уличных банд, головорезов, повстанческих движений, культов, сорвиголов, лудиков, интернет-шизов, сообществ волшебников... Скажем так: в основном это нищие и/или припизднутые люди. Ёмко описать их трудно, но всех членов RGG объединяет так или иначе "странный" образ жизни.\\n\
RGG состоит из группировок совершенно разного размера. Многие свиперы думают, что повстанцы на заданиях - это вся RGG, но на самом деле повстанцы составляют лишь малую долю из того, кого RGG принимают в свои ряды.\\n\
Все члены фракции владеют энергией гемблинга и активно используют её в быту и бою. RGG считает, что чем шизовее и эзотеричнее человек, тем он сильнее. К сожалению, наблюдения неоднократно подтверждали, что в случае с ними так оно и есть.\\n\
Иерархия у них инвертирована: самые высокопоставленные члены RGG безработны и живут в ужасных условиях, а низшие остаются "пешками системы и материального мира". Не волнуйтесь, если мимо проедут тюнингованные фиолетовые тачки. А вот если к вам какой-то мудак приближается на осле или катится верхом на шине, как циркач на шаре - вот это уже пиздец."
jcms.codex_factions3="-# Мафия\\n\
Они управляют полицией, городскими службами и инфраструктурой. Мафия - благотворительная организация: бесплатно помогает людям и занимается всей такой хренью. Их дурацкий логотип с жёлтой шляпой и рукопожатием вы будете видеть повсюду.\\n\
Под самодовольным фасадом чести скрывается страшная правда: Мафия хочет, чтобы вы нас ненавидели. Всё, что они делают, призвано выставить их благородными святошами и заслужить доверие народа. Зуб даю, каждого, кому они помогают, они настраивают против J Corp. Они захватывают наши объекты, крадут наши наработки и неуважительно переделывают нашу технологию их под себя.\\n\
Мафия попытается убедить вас, будто это они изобрели полёт быстрее скорости света, дешёвое жильё и телепортацию электричества в любую точку земного шара (что J Corp раз за разом опровергает - эти дауны же сто процентов куда-то провода прячут), хотя большую часть технологий тёмной материи и энергии они нагло спиздили у нас.\\n\
Мафия вкладывается в кибернетические улучшения и биоинженерию. Они якобы "изобрели" лекарства от страшных болезней и "вернули нуждающимся здоровое тело", но количество производимого и кибернетически модифицируемого ими биооружия вроде муравьиных львов не может не настораживать. Кто знает, чем ещё они занимаются втайне? Хорошо хоть свиперам не приходится иметь дело с их отрядами MWAT."

jcms.codex_gambling_name="Энергия гемблинга"
jcms.codex_gambling="# Гемблинг\\n\
Таинственная сила природы. По имеющимся сведениям, человечество коллективно получило способность гемблить после событий 20 июня 2286 года.\\n\
Наша корпорация запрещает использование гемблинга без разрешения начальства или вне рамок Прикладных Гемблинг-Технологий (ПГТ).\\n\
Процесс гемблинга называется "флипом". Он позволяет поставить на кон перед вселенной что угодно и либо потерять это, либо получить вдвое больше. Когда мы говорим "что угодно", мы вообще не шутим. Речь не только о материальных предметах и людях, но и о нематериальных вещах: мыслях, навыках, знаниях. Да блин, гемблинг применим даже к абстракнтым понятиям и законам физики. "Флип" происходит, когда человек сознательно решает чем-либо рискнуть. В результате он либо теряет поставленную вещь, либо получает её в двойном объёме - что бы это, блять, ни значило.\\n\
Чаще всего эту способность используют, чтобы удваивать материальные ценности и деньги. Однако разведданные об RGG показывают, что гемблеры высшего уровня способны на впечатляющие трюки: как-то получать тайные знания, "проигрывая своё незнание"; многократно удваивать силу удара до соприкосновения кулака с целью; даже превращать промахи в идеальные попадания, "проигрывая сам промах". Способности многих бойцов RGG многократно и молниеносно усиливают прямо на выходе из машины флип-клонирования, создавая суперсолдат за считанные мгновения. Правда, мало кто говорит о том, что случается с ними при проигрыше. Вероятно, именно отсюда берутся едва существующие фиолетовые призраки, которые мечутся в боли, будто застряли где-то на границе нашего мира и пространства возможностей, то появляясь, то исчезая. Напоминаем всем свиперам: J Corp запретила гемблинг не просто так.\\n\Огромные объёмы энергии гемблинга создают фиолетовое свечение, часто заметное на технике RGG. Как именно это работает - ещё предстоит выяснить. Мы также не знаем, является ли "зелёная энергия" вортигонтов той же самой фиолетовой "энергией гемблинга", связаны ли они вообще. Однако известно, что "зелёная энергия" имеет отношение к "судьбе", поэтому разумно предположить некую связь между "гемблингом" и "судьбой".\\n\
Несмотря на разрушительный потенциал силы гемблинга (как нетрудно догадаться, от полного уничтожения всей нашей корпорации нас отделял бы один флип), повлиять на судьбу настолько, чтобы уничтожить человечество, Землю, вселенную или других важных участников сюжета, по всей видимости, невозможно. Точные причины неизвестны. Да и кого ебёт? J Corp, RGG и Мафия так и продолжают существовать. Может, мы просто живём в той временной линии, где такой катастрофы никогда не случится. А может, кто-то давным-давно проиграл способность проигрывать важные вещи во вселенной."

jcms.codex_metals_name="Минералы и химия"
jcms.codex_metals1="# Экзотические материалы\\n\
Поскольку таблица Менделеева была недостаточно прикольной, человечество получило доступ к экзотическим химическим элементам с атомными номерами далеко за пределами натуральных чисел. Ладно, мы не знаем, насколько образован средний свипер, поэтому предположим, что уроки химии вы проспали.\\n\Слушайте сюда: надоел элемент №8 (кислород), элемент №1 (водород), элемент №26 (железо) и так далее? Приготовьтесь к элементу №1.5, элементу №-4, элементу №"Jосподи, помоги, мне больно" (да, всё это предложение было числом), элементу №"52+3i" и так далее. Веселью нет предела!\\n\P.S. Для тех, кто всё-таки слушал на химии: заткнитесь. Заткнитесь. Ради Jоспода, не спрашивайте, сколько у них протонов и электронов. Разве не очевидно? У элемента J - J протонов и J электронов. Всё совершенно логично. И, пожалуйста, не рассматривайте их под микроскопом. Единственного нашего учёного, который попытался это сделать, при загадочных обстоятельствах нашли без головы. Мы ВАС УВОЛИМ и перережем всех, кого вы знаете."
jcms.codex_metals2="-# Джейкорпий\\n\
Прекраснейший элемент со множеством чудесных свойств! Джейкорпий - красный металл с атомным номером J. Из его сплавов мы строим подавляющую часть нашей техники, включая все устройства, турели и машины, которыми вы пользуетесь в бою.\\n\Джейкорпий обладает уникальной способностью образовывать невероятно прочные связи с собой и другими элементами. В конце концов, у каждого атома есть диплом бакалавра экономики. Устанавливая деловые связи с другими атомами, сплавы джейкорпия становятся крайне стойкими к любым повреждениям и деформациям. Благодаря этому свойству, наша продукция сохраняет форму и не гнётся даже под постоянной нагрузкой веса и постоянного обстрела. Замечали, насколько тонкие балки соединяют крылья транспортого самолёта DS-2 с его корпусом?\\n\Конечно, как и у любого хрупкого материала, у джейкорпия есть предел прочности. Накопив достаточно напряжения, он взрывается. Просто берёт и взрывается. Нет, мы не имеем в виду, что он "разлетается", как стекло под гидравлическим прессом: он буквально вспыхивает пламенем. Особенно хреново это при его добыче, поскольку оксид джейкорпия особенно склонен бабахнуть."
jcms.codex_metals3="-# Арджиджиум\\n\
Фиолетовое... нечто. Чистый арджиджиум напоминает губчатое, пластичное вещество. RGG часто использует соединения арджиджиума в своей технике, как и мы используем джейкорпий. Его главное свойство крайне простое: атомы постоянно флипаются, удваиваясь или исчезая в случайные моменты времени. Если заснять на видео блок арджиджиума и ускорить, то можно будет увидеть, как он растёт, гнётся, сжимается и неожиданно меняет форму.\\n\
RGG применяет арджиджиум при создании гемблинг-устройств. В первую очередь игровых автоматов, хотя мы встречали и боевое применение - например, боеприпасы из арджиджиума, которые сами размножаются в магазине.\\n\
Подчёркиваем: в этих атомных флипах НЕТ ВООБЩЕ НИКАКОЙ ЗАКОНОМЕРНОСТИ, из-за чего арджиджиум является недетерминированным веществом. По сути, это самое близкое к "истинной случайности", что есть в нашей вселенной. Следовательно, пока существуют арджиджиум и гемблинг, детерминизм не может быть верен. Этот элемент по-настоящему ломает наши представления о реальности."
jcms.codex_metals4="-# Мафий\\n\
Нет, это не настоящий элемент. Это просто золото, медь, сера, да что угодно. Мафия пытается убедить весь мир, что такой элемент существует. Послушайте: нет его. Их руководство буквально контрабандой завозило грузовики жёлтых камней, пытаясь выдать за мафий.\\n\
ВСЕМ ШПИОНАМ МАФИИ, КОТОРЫЕ ЭТО ЧИТАЮТ: ХВАТИТ, БЛЯТЬ, УТВЕРЖДАТЬ, ЧТО ОН НАСТОЯЩИЙ. МЫ БУКВАЛЬНО, СУКА, ПОДТВЕРДИЛИ, ЧТО АТОМНЫЙ НОМЕР ОБРАЗЦА - 79. ЭТО ПРОСТО ЗОЛОТО. НЕ МАФИЙ. ЕСЛИ ОНО ЖЁЛТОЕ, ЭТО НЕ ЗНАЧИТ, ЧТО ВЫ МОЖЕТЕ НАЗВАТЬ ЕГО МАФИЕМ. ДЖЕЙКОРПИЙ НАСТОЯЩИЙ, НО МЫ ЖЕ НАХУЙ НЕ ГОВОРИМ, ЧТО КРОВЬ КРАСНАЯ ИЗ-ЗА J, ТАК ЛИ?\\n\
Мафий не обладает ВООБЩЕ никакими интересными свойствами. В мафии заявляют, что он позволяет "перенаправлять и телепортировать энергию на небольшие расстояния без потерь". Якобы с его помощью они "сжимают пространство", "создают карманные измерения", "летают быстрее света" и, что интереснее, "стреляют сверхточными энергетическими лучами с КПД выше 100%". Вероятно, речь о тех лучах, которыми палят из глаз некоторые муравьиные львы. Так вот, НАШИ лучи НЕ ИСПОЛЬЗУЮТ "МАФИЙ". Наши великолепные орбитальные лучи открывают миллиарды крошечных порталов и атом за атомом телепортируют потоки вольфрамовой плазмы температурой 20 000 000 K. Ну как вам такое? А? Ебаные ублюдки из Мафии. Запоминайте: элемента "мафий" не существует, а если бы и существовал, был бы совершенно и абсолютно бесполезен."

