jcms.codex_theevent_name="Проишествие"
jcms.codex_theevent="# Событие 20.06.2286\\n\
Доступ к следующей информации означает, что вы заслужили достаточно уважения в программе Map Sweepers, чтобы вам доверяли общеизвестные сведения.\\n\
В просторечии известное как "(Первая) волна респавна", в документах J Corp оно называется просто "Событием" или "Проишествием", чтобы звучать как можно более загадочно. Принято считать, что оно положило конец вечной смерти и начало современной истории.\\n\
Базовые факты знают все: в течение нескольких дней начиная с 20 июня 2286 года система респавна вернула к жизни каждого умершего (за всю историю) человека. Причём в случайных точках земного шара. Были замечены в том числе первобытные люди. А те, кто погибал из-за появления в каком-нибудь дурацком месте, потом просто респавнились снова, поэтому ситуация была гораздо менее срочной, но всё ещё неприятной.\\n\
К концу События население Земли достигло примерно 130 миллиардов человек. Надо полагать, человечество пережило крупнейший социально-экономический кризис в своей истории. Не хватало предметов первой необходимости - еды, воды, жилья и, вероятно, терпения. Это стало отличным поводом начать публично применять прежде экспериментальные устройства на тёмной энергии - которые, заметим, по удивительному совпадению активно исследовались незадолго до События - чтобы сжимать пространство, открывать карманные измерения и питать энергией всё необходимое для удовлетворения катастрофически высокого спроса.\\n\
Всё, во что люди только верили, либо перестало иметь значение, либо, наоборот, подтвердилось и укрепилось до абсурда. Сейчас это трудно представить, но тогда человек мог умереть и его можно было заставить замолчать навсегда. Нынче, к сожалению, наши проблемы так просто не решить. Построить общество, а потом лишиться настолько важного факта, как смерть, которая диктовал порядок вещей... Наверное, многие были недовольны."

