jcms.codexlegacy_jcms_name="Программа Свиперов"
jcms.codexlegacy_jcms="# Свиперы\\n\
  Код: JCMS\\n\
  Масштабный проект, впервые запущенный J Corp в 2925 году, частью которого теперь являетесь и вы, уважаемый свипер. Цель проекта проста: уложить под землю как можно больше НПС. Зачем? Ради бизнеса.\\n\
  J Corp тратит на этот проект дохрена ресурсов - как финансовых, так и человеческих - из чистой ненависти к НПС, а взамен ничего не получает (несмотря на все заявления о прибыльности дела).\\n\
  Кто же такие сами свиперы? На самом деле, они даже не официальные сотрудники J Corp. Корпорация просто набирает добровольцев и случайных людей с улицы. Конечно, им нужно пройти небольшой тест. Они должны:\\n\
 1. Уметь отличать друзей от врагов (необязательно)\\n\
 2. Уметь пользоваться оружием (необязательно)\\n\
 3. Наносить хоть какой-нибудь урон\\n\
  Если они соответствуют всем условиям, то могут стать свипером! Если не соответствуют - тоже могут. После этого корпорация выдаёт им неограниченный доступ к огнестрельному и энергетическому оружию, взрывчатке, турелям, боевой технике, орбитальным лазерам и даже ядерным боеголовкам (но только если те вежливо попросят). Затем свиперов доставляют в различные точки интереса по всей мультивселенной и Jити, чтобы они убивали всё, у чего не обнаружено человеческого мозга.\\n\
  Вся эта операция почти ничего не приносит J Corp. "J-кредиты", которые свиперы получают на заданиях, являются внутрикорпоративной валютой, а значит, совершенно бесполезны вне программы. Несмотря на это, миллиарды (по выходным - триллионы) людей стоят в очередях и с нетерпением ждут возможности стать свипером."

jcms.codexlegacy_world_name="Мир ("Clashverse")"
jcms.codexlegacy_world="# Clashverse\\n\
  "Clashverse" - название вселенной, в которой происходит действие этого аддона. Она берёт начало с закрытого Discord-сервера, где обитают создатели и бета-тестеры аддона.\\n\
  Год - (текущий год + 900). Планета Земля, ближайший космос и неизвестное количество других вселенных целиком поглощены "Jити Jевентин", а власть идеально поровну поделена между тремя фракциями: J Corp, RGG и Мафией.\\n\
  Вместо того чтобы в подробностях объяснять, что это вообще всё такое, давайте просто пробежимся по основам, чтобы вы уловили суть:\\n\
 - Жизнь во вселенной превратилась в один большой щитпост. Логика видеоигр и мемов работает и в реальности.\\n\
 - Существует каждый вымышленный персонаж, а любая вселенная из игры, фильма, книги и т.п. является частью Clashverse. Разница лишь в том, что их обычно перекрашивают или приписывают к одной из трёх существующих фракций. Например, "Святые" из Saints Row входят в RGG, потому что они фиолетовые.\\n\
 - Люди не могут умереть, через 15 секунд они респавнятся. Несмотря на это, все по-прежнему боятся смерти и считают убийство средством достижения своих целей. Разыгрываются целые драмы и сюжеты о мести, а затем убитый тип просто респавнится неподалёку, и все делают вид, будто ничего такого и не произошло.\\n\
 - Если люди ожидают, что что-то произойдет, то оно и произойдет. События притянуты за уши. Тропы применимы практически ко всему.\\n\
 - Каждый день происходят тысячи сценариев конца света. Это совершенно нормально. Ядерная война? Обычное воскресенье. Вторжение пришельцев? Всё равно надо ехать в офис. "Туман" надвигается? Да, да, кучу раз уже слыхали.\\n\
 - Население мира просто колоссально. Самый мощный суперкомпьютер в мире до сих пор подсчитывает, сколько именно людей живёт в Jити. В этом числе уже больше квадриллиона цифр, и каждую секунду добавляются ещё тысячи.\\n\
 - Все, кто когда-либо жил и умер за всю историю, теперь живы. Как только появилась система респавна, в Раю, Аду, Чистилище и прочих местах просто как-то возникла ебучая дверь, ведущая в Jити. Единственный, кто остался в преисподней - Сизиф. Он всё ещё толкает камень в гору.\\n\
 - Время и пространство в разных местах сжаты. Можно зайти в маленький сарай и обнаружить внутри целую планету. Африку специально замедлили, чтобы утверждение "каждые 60 секунд в Африке проходит минута" стало ложным. Фабрики и рабочие места ускорены в тысячи раз. Возможно практически всё.\\n\
  Можете поискать любые проклятые картинки в интернете - всё это будет абсолютно канонично и нормально для Clashverse."

jcms.codexlegacy_factions_name="Фракции мира"
jcms.codexlegacy_factions1="# Фракции\\n\
  Как упоминалось в предыдущей записи, власть над миром поровну поделена между тремя враждующими фракциями: J Corp, RGG и Мафией. Любая другая существующая или потенциально существующая фракция является дочерней организацией одной из этих трёх - в зависимости от сходства мотивов, целей и эстетики.\\n\
  Районы, карты, города, планеты и вселенные под контролем фракции получают цветовой фильтр/цветной туман под стать фракции. И наоборот: если в какой-то местности преобладает подходящий фракции цвет, она автоматически принадлежит этой фракции. Например, большинство пустынь принадлежит Мафии, Зен - RGG, Марс - J Corp. Конечно, бывают исключения, и если бы RGG, например, вторглась на Марс, то в пределах её территории он частично бы стал фиолетовым.\\n\
  Эти фракции без какой-либо причины воюют друг с другом. Впрочем, это не мешает им время от времени случайно сотрудничать. Иногда RGG вместе с J Corp наваливается на Мафию. Иногда J Corp одалживает Мафии оружие и личный состав, чтобы помочь ей напасть на саму же себя. Иногда одна фракция просто воюет сама с собой - так бывает. Ничего личного."
jcms.codexlegacy_factions2="# J Corp\\n\
-# Руководитель: JonahSoldier; заместитель: MerekiDor\\n\
  Комично злая государственно-корпоративная структура. Не производит ничего полезного и существует исключительно ради того, чтобы быть как можно злее и пакостнее. Угнетает людей и творит злую херню ради самой злой херни. J Corp отвечает за "налогообложение" населения - эти налоги на самом деле никуда не идут, даже в саму J Corp; деньги просто навсегда исчезают. Корпорация ненавидит природу и загрязняет её при любой возможности.\\n\
  Использует красный цвет, ненавидит синий. J Corp также занимается мелкой бесячей хуйней, например, клеит пропагандистские плакаты на двери падиков, используя, знаете, мерзкий такой клей, из-за которого бумага остается при попытке отодрать.\\n\
  На J Corp работают многие злодеи из других вселенных, все персонажи типа "злой/жадный гендиректор" и "тёмный властелин". Красный цвет или любовь к деньгам тоже повод быть во фракции. Примеры:\\n\
 1. Доктор Брин (Half-Life 2)\\n\
 2. Хойт Волкер (Far Cry 3)\\n\
 3. Боб Пейдж (Deus Ex)\\n\
 4. Дарт Вейдер (Star Wars)\\n\
 5. Филипп Лорен (Saints Row: The Third)\\n\
 6. Эдвард Диего (System Shock)\\n\
 7. Кейв Джонсон (Portal 2)\\n\
 8. Дэниел Плэйнвью (There Will Be Blood, 2007)\\n\
 9. Аин (Lobotomy Corporation)\\n\
 10. Фуфелшмерц (Phineas and Ferb)\\n\
 11. Джереми Блэр (Outlast)\\n\
 12. Вы, если любите красный цвет. Или деньги.\\n\
  Эстетика: угловатый дизайн, враждебность, антиутопия, бетон и металл, заводы и трубы, комично огромный уровень индустриализации и т.д."
jcms.codexlegacy_factions3="# RGG\\n\
-# Руководитель: Traeesen\\n\
  Расшифровка названия: [ДАННЫЕ УДАЛЕНЫ]. По сути это сборище хаотичных бандитов, проходимцев и безумных гангстеров, которые проигрывают все деньги так же быстро, как зарабатывают. Члены этой фракции вечно на мели, но она всё равно контролирует треть мира и каким-то образом хвастается самыми чистыми улицами.\\n\
  Её цвета: фиолетовый, индиго и фуксия. Почти любое видео в 144p из стран второго или третьего мира - обычный день в RGG. Они намеренно пользуются комично дешёвыми и самодельными вещами, хотя нормальная техника у них тоже есть. При этом районы RGG чрезвычайно роскошны: фракции принадлежит множество небоскрёбов, дворцов и особняков, просто из принципа ими никто не пользуется. Подконтрольные территории выглядят примерно как Город Зеркал из Mirror's Edge: Catalyst. Эстетика синтвейва (ретровейва) тоже принадлежит RGG.\\n\
  Большинство персонажей из разряда "шайка друзей-долбаебов", а также всякие бунтари, идеалисты, психи, непредсказуемые хаотичные личности и уличные банды входят в RGG. Некоторые примеры:\\n\
 1. Юпитерские Сепаратисты (Barotrauma)\\n\
 2. Фанаты (Hotline Miami 2)\\n\
 3. Банда "Святые" (серия Saints Row)\\n\
 4. Тревор Филипс (GTA V)\\n\
 5. Левелин Мосс (No Country for Old Men, 2007)\\n\
 6. Джокер (DC Comics)\\n\
 7. Ария Т'Лоук (Mass Effect)\\n\
 8. Тайлер Дёрден (Fight Club, 1999)\\n\
 9. Тот ваш знакомый, который ебашит в казик (может, вы?)\\n\
 10. Почти любые персонажи из мультиков, которые типа такие "сила дружбы, вперёд!"."
jcms.codexlegacy_factions4="# Мафия\\n\
-# Руководитель: Xelerax\\n\
  Как ни странно, единственная законопослушная фракция вселенной. Мафия выдаёт займы нуждающимся и в целом является весьма благородной организацией. Первые три года работы они не знали, что "мафия" вообще-то должна быть преступной организацией.\\n\
  Их цвета - жёлтый и оранжевый, а эстетика сочетает правоохранительные органы, организованную преступность вроде якудза, сицилийской мафии и южноамериканских картелей, а ещё ковбоев. Каким-то образом. В общем, почти всё, что ассоциируется с этими цветами.\\n\
  Мафия управляет всей той "полицией", которая ещё осталась в мире, и держит отряды MWAT из спецназовцев с автоматами Томпсона и в федорах. Иногда они коррумпированы и занимаются незаконными делами, но в основном ради общего блага. Примеры персонажей и организаций, работающих на Мафию:\\n\
 1. Гордон Фримен (Half-Life 2)\\n\
 2. Советник (XCOM)\\n\
 3. Дэвид Шариф (Deus Ex)\\n\
 4. Протекторат (Starbound)\\n\
 5. Тони Монтана (Scarface, 1983)\\n\
 6. Макс Пэйн (Max Payne)\\n\
 7. Артур Морган (Red Dead Redemption 2)\\n\
 8. Большой Палец (Library of Ruina)\\n\
 9. Папирус и Санс (Undertale)\\n\
 10. Кадзума Кирю (Yakuza)\\n\
 11. GDI (вселенная Command & Conquer: Tiberium)"

