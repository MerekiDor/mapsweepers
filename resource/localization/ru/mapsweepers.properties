jcms.missiontag_extraorders_desc=На этой миссии вам будут доступны уникальные опции в меню вызова, которые помогут вам в прохождении.
jcms.missiontag_hacking=Нужно взламывать
jcms.missiontag_hacking_desc=На этой миссии вы столкнётесь с терминалами, которые потребуется взломать для прохождения.
jcms.missiontag_infighting=Стычки врагов
jcms.missiontag_infighting_desc=Враги из разных фракций могут атаковать друг друга.
jcms.missiontag_timer=Ограниченное время
jcms.missiontag_timer_desc=На определённые цели вам дается ограниченное количество времени.
jcms.missiontag_killsrequired=Необходимо убивать
jcms.missiontag_killsrequired_desc=На данной миссии, убийство врагов является одним из необходимых условий.
jcms.missiontag_rarebosses=Редкие боссы
jcms.missiontag_rarebosses_desc=Вы столкнётесь с уникальными и очень сильными боссами по мере прохождения.
jcms.missiontag_naturalhazard=Природная опасность
jcms.missiontag_naturalhazard_desc=На этой миссии есть природные опасные факторы.
jcms.missiontag_unofficial=Неофициальная миссия
jcms.missiontag_unofficial_desc=Миссию добавил сторонний аддон, её нет в оригинале Map Sweepers.
jcms.missiontag_bossmission=Винстрик-миссия
jcms.missiontag_bossmission_desc=Сложная миссия, которая доступна только после нескольких побед подряд.

