jcms.nnv_a_desc=Это самый быстрый способ начать игру. В аддоне есть официальные карты, которые хорошо работают. Либо, когда ищите карты, обращайте внимание на наличие NavMesh в описании.
jcms.nnv_b_desc=Многие добрые люди создают аддоны, которые добавляют NavMesh на те карты, создатели которых поленились сами это сделать.\n\nПоищите аддон '%s navmesh', может что-то найдется.
jcms.nnv_c_desc=ВНИМАНИЕ: Нужен хороший компьютер, а генерация NavMesh на огромных картах может занять ОЧЕНЬ МНОГО ВРЕМЕНИ!\n\nВ консоли введите команду 'nav_generate', а потом 'nav_analyze'. После этого на карте можно будет играть. Процесс долгий, но, к счастью, это нужно сделать лишь один раз.

