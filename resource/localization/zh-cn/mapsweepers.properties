jcms.class_recon=侦察兵
jcms.class_recon_special=游击 & 情报
jcms.class_recon_desc=开启二段跳，并会在二段跳时产生微弱的爆炸。\n免疫坠落伤害，并且跑得比平时快。\n可以透视某些实体，发现的目标会为队友标记。\n冲刺时仍然可以开枪。

jcms.class_infantry=步兵
jcms.class_infantry_special=压制 & 节俭
jcms.class_infantry_desc=使用武器时造成的伤害增加 25%。\n攻击时有 50% 的几率不消耗任何弹药。甚至包括手榴弹。\n如果你真的只是想射爆一切，这就是为你准备的选择。

jcms.class_sentinel=哨兵
jcms.class_sentinel_special=壁垒 & 转移
jcms.class_sentinel_desc=护盾极其强大，可以通过击杀敌人来充能。\n当护盾被打破时，你会随机传送到别处。\n速度很慢，但冲刺速度会随着奔跑时间的增加而提升。\n免疫有毒气体。

jcms.class_engineer=工程兵
jcms.class_engineer_special=建造 & 支援
jcms.class_engineer_desc=你将获得一把重力枪，用于移动炮塔和物体。\n更便宜的轨道打击与爆炸物。\n所有呼叫支援的冷却时间更短。\n你的所有防御设施都将得到强化。

