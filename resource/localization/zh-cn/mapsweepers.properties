jcms.restock=弹药补给
jcms.restock_desc=空投一个板条箱，为你提供所需的所有弹药类型。你总共将获得大约价值 400 J的弹药
jcms.firstaid=医疗空投
jcms.firstaid_desc=空投一个板条箱，每次使用恢复 25 HP，最多恢复 100 HP
jcms.antirad=抗辐射空投
jcms.antirad_desc=空投一个板条箱，使用后赋予 60 秒的辐射免疫。
jcms.jumppad=跳跃垫
jcms.jumppad_desc=放置一个垫子来提升你的跳跃高度。防止坠落伤害
jcms.mine_c4=定时炸药
jcms.mine_c4_desc=放置后 10 秒发生巨大的强力爆炸
jcms.turret_smg=冲锋枪炮塔
jcms.turret_smg_desc=对弱小敌人进行持续射击
jcms.turret_shotgun=霰弹枪炮塔
jcms.turret_shotgun_desc=以大弧度开火，摧毁近距离的所有人
jcms.shelling=炮击
jcms.shelling_desc=影响大面积区域的轨道轰炸，持续 1 分钟
jcms.mine_breach=破门炸药
jcms.mine_breach_desc=炸开锁住的门。附着在其他任何东西上都会产生极强的击退效果
jcms.turret_bolter=爆弹炮塔
jcms.turret_bolter_desc=缓慢发射威力强大且精准的爆弹
jcms.i_umbrella=雨伞
jcms.i_umbrella_desc=提供免受有毒雨水侵袭的掩护
jcms.ts_sapper=工兵炸药
jcms.ts_sapper_desc=把它安装在蚁狮驱逐装置上，它会慢慢将其摧毁。如果你有时间，这比C4便宜
jcms.autohacker=自动骇客装置
jcms.autohacker_desc=将此连接到终端并保护其免受NPC攻击。1 分钟后终端将被骇入
jcms.locator=定位器
jcms.locator_desc=显示前往最近目标的距离和罗盘方向。在大地图上很有用
jcms.shieldcharger=护盾充能器
jcms.shieldcharger_desc=以 5/s 的速率为附近玩家的护盾充能。最终会耗尽
jcms.respawnbeacon=重生信标
jcms.respawnbeacon_desc=如果有人死亡，他们将在这个一次性平台上重生
jcms.tesla=特斯拉电圈
jcms.tesla_desc=发射可在多个目标之间弹射的电流
jcms.mine_multiblast=多重爆破地雷
jcms.mine_multiblast_desc=一种低范围地雷，在消失前可爆炸 4 次
jcms.carpetbombing=地毯式轰炸
jcms.carpetbombing_desc=沿直线投下许多威力较弱、精度不高的炸弹
jcms.antiairmissile=防空导弹
jcms.antiairmissile_desc=一种导弹，会跟踪并在飞行NPC（如炮艇或直升机）旁边引爆
jcms.orbitalbeam=轨道激光
jcms.orbitalbeam_desc=发射一道强大的寻的激光束，摧毁一切
jcms.vtol=运输船
jcms.vtol_desc=DS-2 垂直起降运输机，有 6 个乘客座位，可在区域内快速运输
jcms.turret_gatling=加特林炮塔
jcms.turret_gatling_desc=转动缓慢，但提供猛烈的压制火力
jcms.hovertank=坦克
jcms.hovertank_desc=LHT-6，配备双等离子炮和微型导弹蜂群发射器
jcms.apc=装甲运兵车
jcms.apc_desc=JPC-0，有 4 个乘客座位和无敌护盾，非常适合突破包围圈
jcms.turret_smrls=导弹平台
jcms.turret_smrls_desc=防空 + 迫击炮二合一。使用制导导弹攻击一切
jcms.smoke=烟雾弹
jcms.smoke_desc=在与你垂直的路径上投下几颗烟雾弹

jcms.missionunknown=未知任务
jcms.payload=运载目标
jcms.payload_entity=运载目标
jcms.payload_desc=靠近轨道上的平台，将其从 A 点移动到 B 点。在它旁边杀死敌人会给它加速。
jcms.thumpersabotage=破坏蚁狮驱逐装置
jcms.thumpersabotage_desc=找到并摧毁地图上的所有蚁狮驱逐装置。随着你的进展，蚁狮将开始取代联合军士兵。建议使用爆炸物。
jcms.violenceflashpoints=暴力冲突点
jcms.violenceflashpoints_desc=通过在冲突点旁边杀死足够的 NPC 来为所有冲突点充能。之后将释放一个强大的 Boss。
jcms.hell=地狱
jcms.hell_desc=想尽办法活下去。你有1分钟的准备时间。
jcms.thumperreactivation=重启蚁狮驱逐装置
jcms.thumperreactivation_desc=找到并重新启动该区域中关闭的蚁狮驱逐装置，以驱赶蚁狮。
jcms.mainframe=主计算机
jcms.mainframe_desc=骇入为 RGG 赌博主计算机提供赌博能量的电源线。每条被骇入的线路都会禁用主计算机的部分防御，并为你提供相应的奖励。
jcms.infestation=清除感染
jcms.infestation_desc=息肉已经感染了这个区域。找到并启动核弹以净化地图。保护核弹直到激活，否则它们会提前爆炸！
jcms.miningoperations=采矿作业
jcms.miningoperations_desc=在地图各处开采矿石块，并将其带到精炼厂。收集足够的矿石让我们出售。订购板条箱以批量运送矿石。
jcms.datadownload=数据下载
jcms.datadownload_desc=我们弄到了联合军的数据资料库。找到主计算机，按下上传按钮，然后保护下载数据，直到情报归我们所有。

